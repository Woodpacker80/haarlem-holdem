<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Haarlem Hold'em — Squeeze Mechanic v4 (Vertex Curl)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#080c18; overflow:hidden;
    font-family:'Montserrat',-apple-system,sans-serif; color:#e9e2cf; touch-action:none; }
  #hud { position:absolute; top:0; left:0; width:100%; text-align:center; z-index:10; pointer-events:none; }
  #hud h1 { font-size:14px; font-weight:600; letter-spacing:0.06em; color:#c9a84c; text-transform:uppercase; margin:14px 0 2px 0; }
  #hud .sub { font-size:11px; color:#7d8299; margin:0 auto; max-width:520px; line-height:1.5; }
  #bottomStack { position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:16px; z-index:10; width:440px; max-width:96vw; }
  #controls { display:flex; align-items:center; gap:12px; width:100%; }
  input[type=range] { flex:1; accent-color:#BE1622; height:28px; }
  .readout { font-size:14px; color:#c9a84c; width:52px; text-align:right; font-variant-numeric:tabular-nums; }
  #buttons, #cornerButtons { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; row-gap:12px; }
  button { background:transparent; border:2px solid #c9a84c; color:#c9a84c; padding:12px 20px;
    border-radius:8px; font-size:14px; letter-spacing:0.05em; text-transform:uppercase; cursor:pointer;
    white-space:nowrap; min-height:44px; min-width:44px; }
  .cornerBtn { font-size:20px; padding:10px 22px; }
  button:hover, button:active { background:rgba(201,168,76,0.2); }
  canvas { display:block; cursor:grab; }
  canvas:active { cursor:grabbing; }
  #calibReadout { display:none; position:absolute; top:100px; right:10px; max-width:260px;
    background:rgba(8,12,24,0.9); border:1px solid #c9a84c; border-radius:8px; padding:8px 10px;
    font-size:10px; color:#e9e2cf; z-index:10; text-align:left; white-space:pre-wrap; font-family:monospace; }
</style>
</head>
<body>

<div id="hud">
  <h1>Squeeze Mechanic — Vertex Curl Pass <span style="color:#7d8299;font-size:11px;">[BUILD V7.2 — nudged left, fixed]</span></h1>
  <div class="sub">One card, one deforming surface: the bottom-left corner curls smoothly toward the
  camera as real cardstock would. The second card stays flat and mostly hidden beneath it.</div>
</div>
<div id="bottomStack">
  <div id="controls">
    <span style="font-size:11px;color:#7d8299;">SQUEEZE</span>
    <input type="range" id="slider" min="0" max="100" value="90">
    <span class="readout" id="readout">0%</span>
  </div>
  <div id="cornerButtons">
    <span style="font-size:11px;color:#7d8299;align-self:center;margin-right:4px;">CORNER</span>
    <button class="cornerBtn" data-cx="0" data-cz="0">↙</button>
    <button class="cornerBtn" data-cx="1" data-cz="0">↘</button>
    <button class="cornerBtn" data-cx="0" data-cz="1">↖</button>
    <button class="cornerBtn" data-cx="1" data-cz="1">↗</button>
  </div>
  <div style="margin-top:4px;">
    <label style="font-size:13px;color:#c9a84c;display:flex;align-items:center;gap:6px;justify-content:center;">
      <input type="checkbox" id="deepSqueezeToggle">
      Deep Squeeze mode (unroll from bottom edge, whole face)
    </label>
  </div>
  <div id="buttons">
    <button id="autoBtn">Auto-Demo</button>
    <button id="resetBtn">Reset</button>
    <button id="calibBtn">Calibrate Camera</button>
  </div>
</div>
<div id="calibReadout"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="card-art.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080c18);
scene.fog = new THREE.Fog(0x080c18, 4, 9);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.05, 50);
// Same calibrated viewing ANGLE as before — this direction is preserved exactly.
const calibratedPos = new THREE.Vector3(-1.87, 0.69, 3.67);
const calibratedLookAt = new THREE.Vector3(-0.32, -0.15, -0.52);
const viewVector = calibratedPos.clone().sub(calibratedLookAt);
const viewDir = viewVector.clone().normalize();

// V7.1 fix: V7.0 fit a bounding SPHERE around the cards, which wastes
// distance — a sphere's radius includes extent along the camera's own
// viewing axis (depth), which takes up zero screen space and shouldn't
// count toward "does this fit on screen". That's why V7.0 zoomed out
// further than necessary. Fix: project the padded box's corners onto the
// camera's actual right/up axes to get the true on-screen half-width and
// half-height, then solve distance from those directly. Tighter margin
// (3%) since this method no longer needs slack for the wasted-sphere case.
const worldUp = new THREE.Vector3(0, 1, 0);
const camRight = new THREE.Vector3().crossVectors(viewDir, worldUp).normalize();
const camUp = new THREE.Vector3().crossVectors(camRight, viewDir).normalize();

// V7.2 nudge: shift both cards left along world X.
const NUDGE_X = -0.12;

// Bug fix: V7.2's first attempt shifted this frame box by NUDGE_X too, which
// meant the camera target — and therefore the camera itself — moved by the
// same amount as the cards. Since the card's position relative to the camera
// never changed, nothing moved on screen. Fix: keep the target fixed at the
// ORIGINAL center, and only widen the box's left edge by NUDGE_X so the
// margin still covers the cards' new (shifted) position without clipping.
const FRAME_MIN = new THREE.Vector3(-0.909 + NUDGE_X, -0.01, -0.962);
const FRAME_MAX = new THREE.Vector3(0.809, 0.33, 1.222);
const initialTarget = new THREE.Vector3(-0.05, 0.16, 0.13); // original box center, unshifted — camera stays anchored here

let halfW = 0, halfH = 0;
for (const cx of [FRAME_MIN.x, FRAME_MAX.x]) {
  for (const cy of [FRAME_MIN.y, FRAME_MAX.y]) {
    for (const cz of [FRAME_MIN.z, FRAME_MAX.z]) {
      const v = new THREE.Vector3(cx, cy, cz).sub(initialTarget);
      halfW = Math.max(halfW, Math.abs(v.dot(camRight)));
      halfH = Math.max(halfH, Math.abs(v.dot(camUp)));
    }
  }
}
const FRAME_SAFETY = 1.04; // small buffer so edges don't sit exactly on the frustum boundary
let calibrating = false;

function updateCameraFraming() {
  const aspect = window.innerWidth / window.innerHeight;
  camera.aspect = aspect;
  const vFovHalf = THREE.MathUtils.degToRad(camera.fov) / 2;
  const hFovHalf = Math.atan(Math.tan(vFovHalf) * aspect);
  const distance = Math.max(halfH / Math.tan(vFovHalf), halfW / Math.tan(hFovHalf)) * FRAME_SAFETY;
  camera.position.copy(initialTarget).add(viewDir.clone().multiplyScalar(distance));
  camera.updateProjectionMatrix();
  if (!calibrating) camera.lookAt(initialTarget);
}
updateCameraFraming();

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x404860, 0.75));
const key = new THREE.DirectionalLight(0xfff2d6, 1.0);
key.position.set(1.6, 3.2, -1.6);
scene.add(key);
const rim = new THREE.PointLight(0xc9a84c, 0.55, 12);
rim.position.set(0, 1.2, -3.0);
scene.add(rim);

// ---- felt table ----
const table = new THREE.Mesh(
  new THREE.PlaneGeometry(24, 24),
  new THREE.MeshStandardMaterial({ color: 0x0d1626, roughness: 0.95 })
);
table.rotation.x = -Math.PI / 2;
scene.add(table);

// ---- textures (flipY disabled so UV maps directly to canvas pixels, no ambiguity) ----
function makeTexture(draw, size = 512) {
  const cnv = document.createElement('canvas');
  cnv.width = cnv.height = size;
  draw(cnv.getContext('2d'), size);
  const tex = new THREE.CanvasTexture(cnv);
  tex.flipY = false;
  tex.needsUpdate = true;
  return tex;
}
const backTexture = makeTexture((ctx, size) => {
  ctx.fillStyle = '#BE1622';
  ctx.fillRect(0, 0, size, size);
  ctx.strokeStyle = 'rgba(201,168,76,0.7)';
  ctx.lineWidth = size * 0.035;
  ctx.strokeRect(size * 0.08, size * 0.08, size * 0.84, size * 0.84);
  ctx.beginPath();
  ctx.moveTo(size / 2, size * 0.18);
  ctx.lineTo(size * 0.82, size / 2);
  ctx.lineTo(size / 2, size * 0.82);
  ctx.lineTo(size * 0.18, size / 2);
  ctx.closePath();
  ctx.strokeStyle = 'rgba(201,168,76,0.5)';
  ctx.lineWidth = size * 0.018;
  ctx.stroke();
});
// Real card art (card-art.js) — built to this exact same corner-stamp
// geometry (checked line-for-line against the block above before swapping):
// same 0.8%/9%/6.5%/1.2% numbers, same vertical-only flip on the bottom
// corners. Only the typography/color changed (Georgia/near-black ->
// Montserrat/cobalt-burgundy), which the spec leaves open.
function faceTextureFor(rank, suit) {
  const canvas = CardArt.renderFace(rank, suit, 512);
  const tex = new THREE.CanvasTexture(canvas);
  tex.flipY = false;
  tex.needsUpdate = true;
  return tex;
}
let aceTexture = faceTextureFor('A', 'spades');
let twoTexture = faceTextureFor('2', 'spades');

// ---- card geometry ----
// Local space: x in [0,W] (left->right), z in [0,H] (near/lifted -> far), y up.
// The lifted corner is local (0,0,0).
const W = 1.4, H = 2.0, S = 0.62;

function buildFlatCardGeometry(w, h, segs) {
  const geo = new THREE.PlaneGeometry(w, h, segs, segs);
  geo.rotateX(-Math.PI / 2);   // (x,y,0) -> (x,0,y): now lies flat, normal +Y
  geo.translate(w / 2, 0, h / 2); // shift from centered to x:[0,w], z:[0,h]
  const pos = geo.attributes.position;
  const uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    uv.setXY(i, x / w, z / h);
  }
  uv.needsUpdate = true;
  return geo;
}

// A curlable card: its own geometry, its own base (undeformed) coordinates,
// two coincident meshes (back visible from above, face visible only from
// underneath once curled), all wrapped in a Group for placement.
function buildCurlableCard(faceTex) {
  const geo = buildFlatCardGeometry(W, H, 64);
  const pos = geo.attributes.position;
  const bx = new Float32Array(pos.count);
  const bz = new Float32Array(pos.count);
  for (let i = 0; i < pos.count; i++) { bx[i] = pos.getX(i); bz[i] = pos.getZ(i); }
  const backMat = new THREE.MeshStandardMaterial({ map: backTexture, side: THREE.FrontSide, roughness: 0.8 });
  const faceMat = new THREE.MeshBasicMaterial({ map: faceTex, side: THREE.BackSide });
  const group = new THREE.Group();
  group.add(new THREE.Mesh(geo, backMat), new THREE.Mesh(geo, faceMat));
  return { geo, pos, baseX: bx, baseZ: bz, group, faceMat };
}

const cardA = buildCurlableCard(aceTexture); // the top/near card
const cardB = buildCurlableCard(twoTexture); // fanned out to the side, curls in sync

cardA.group.position.set(-0.86 + NUDGE_X, 0.006, -0.9);
// Fanned to the right and slightly forward, at a lower Y so cardA still
// layers on top where they overlap — but its own corner is clear of cardA
// so its curl and index stay fully visible.
cardB.group.position.set(-0.86 + 0.22 + NUDGE_X, 0.003, -0.9 + 0.06);
scene.add(cardA.group, cardB.group);
const curlCards = [cardA, cardB]; // unified pinch: both curl together, same axis/depth, offset only by the fan spacing

// ---- bend: cylindrical curl about a fold axis near whichever corner is selected ----
// Smooth by construction: zero displacement AND zero slope at the fold line.
const SQRT2 = Math.SQRT2;
const kAxis = { x: -1 / SQRT2, z: 1 / SQRT2 };
const nHat  = { x: -1 / SQRT2, z: -1 / SQRT2 };
const THETA_MAX = 130 * Math.PI / 180;
const dMax = S / SQRT2;

let cornerCx = 0, cornerCz = 1; // which corner curls: 0 = near edge, 1 = far edge, per axis

const marker = new THREE.Mesh(
  new THREE.SphereGeometry(0.03, 12, 12),
  new THREE.MeshBasicMaterial({ color: 0xffe066 })
);
scene.add(marker);
function updateMarker() {
  const cx = cornerCx === 0 ? 0 : W;
  const cz = cornerCz === 0 ? 0 : H;
  const world = cardA.group.position.clone().add(new THREE.Vector3(cx, 0.02, cz));
  marker.position.copy(world);
}
updateMarker();

document.querySelectorAll('.cornerBtn').forEach(btn => {
  btn.onclick = () => {
    cornerCx = parseInt(btn.dataset.cx, 10);
    cornerCz = parseInt(btn.dataset.cz, 10);
    updateMarker();
  };
});

function curlOneCard(card, peel) {
  const thetaTotal = peel * THETA_MAX;
  const smallAngle = thetaTotal < 0.0005;
  const rho = smallAngle ? 0 : dMax / thetaTotal;
  for (let i = 0; i < card.pos.count; i++) {
    const rawX = card.baseX[i], rawZ = card.baseZ[i];
    // reflect into the "near corner at origin" frame the formula was derived in
    const x = cornerCx === 0 ? rawX : W - rawX;
    const z = cornerCz === 0 ? rawZ : H - rawZ;
    const d = (S - x - z) / SQRT2;
    if (d <= 0 || smallAngle) {
      card.pos.setXYZ(i, rawX, 0, rawZ);
      continue;
    }
    const phi = d / rho;
    const perp = rho * Math.sin(phi);
    const y = rho * (1 - Math.cos(phi));
    const c = (x - S) * kAxis.x + z * kAxis.z;
    const Ax = S + c * kAxis.x;
    const Az = 0 + c * kAxis.z;
    let nx = Ax + perp * nHat.x;
    let nz = Az + perp * nHat.z;
    // reflect back out of the derivation frame into real local space
    if (cornerCx !== 0) nx = W - nx;
    if (cornerCz !== 0) nz = H - nz;
    card.pos.setXYZ(i, nx, y, nz);
  }
  card.pos.needsUpdate = true;
  card.geo.computeVertexNormals();
}

// ---- DEEP SQUEEZE (V7.3 experiment) ----
// Same underlying idea as curlOneCard above (distance-from-an-anchor-line
// sets the local bend angle, a single global rho controls how tight the
// bend is) but anchored to a straight edge instead of a diagonal corner —
// so the WHOLE face rolls, not just a triangular corner wedge. Bottom edge
// (z=0, wherever the squeeze originates) stays flat and anchored; every
// point above it bends upward by an angle proportional to its height, up
// to thetaTotal at the far edge. As peel grows, that whole range of bend
// gets applied further, so the reveal genuinely progresses bottom-index ->
// center -> top-index, instead of only ever exposing one fixed corner.
// X position never affects the bend — this is a roll around an edge, not
// a corner, so the "which corner" left/right buttons don't matter here,
// only whether cornerCz picks the bottom or top edge as the anchor.
const dMaxDeep = H;
function curlOneCardDeep(card, peel) {
  const thetaTotal = peel * THETA_MAX;
  const smallAngle = thetaTotal < 0.0005;
  const rho = smallAngle ? 0 : dMaxDeep / thetaTotal;
  for (let i = 0; i < card.pos.count; i++) {
    const rawX = card.baseX[i], rawZ = card.baseZ[i];
    const z = cornerCz === 0 ? rawZ : H - rawZ; // distance from the anchored edge
    if (z <= 0 || smallAngle) {
      card.pos.setXYZ(i, rawX, 0, rawZ);
      continue;
    }
    const phi = z / rho;
    const newZlocal = rho * Math.sin(phi);
    const y = rho * (1 - Math.cos(phi));
    const nz = cornerCz === 0 ? newZlocal : H - newZlocal;
    card.pos.setXYZ(i, rawX, y, nz);
  }
  card.pos.needsUpdate = true;
  card.geo.computeVertexNormals();
}

let deepSqueezeMode = false;
document.getElementById('deepSqueezeToggle').addEventListener('change', (e) => {
  deepSqueezeMode = e.target.checked;
});

function applyCurl(peel) {
  curlCards.forEach(card => (deepSqueezeMode ? curlOneCardDeep(card, peel) : curlOneCard(card, peel)));
}

// ---- interaction ----
let peel = 0, targetPeel = 0.9, dragging = false, dragStartY = 0, dragStartPeel = 0;
let autoDemo = false, autoT = 0;

const orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
orbitControls.target.copy(initialTarget);
orbitControls.enabled = false;
orbitControls.update();

const calibBtn = document.getElementById('calibBtn');
const calibReadout = document.getElementById('calibReadout');
calibBtn.onclick = () => {
  calibrating = !calibrating;
  orbitControls.enabled = calibrating;
  calibReadout.style.display = calibrating ? 'block' : 'none';
  calibBtn.textContent = calibrating ? 'Done Calibrating' : 'Calibrate Camera';
};
function updateCalibReadout() {
  if (!calibrating) return;
  const p = camera.position, t = orbitControls.target;
  calibReadout.textContent =
    `camera.position.set(${p.x.toFixed(2)}, ${p.y.toFixed(2)}, ${p.z.toFixed(2)});\n` +
    `orbitControls.target.set(${t.x.toFixed(2)}, ${t.y.toFixed(2)}, ${t.z.toFixed(2)});\n` +
    `— drag to orbit, scroll to zoom. Copy these two lines back to Claude when it looks right.`;
}

const slider = document.getElementById('slider');
const readout = document.getElementById('readout');
document.getElementById('autoBtn').onclick = () => { autoDemo = !autoDemo; };
document.getElementById('resetBtn').onclick = () => { autoDemo = false; targetPeel = 0; slider.value = 0; };

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (calibrating) return;
  dragging = true; autoDemo = false;
  dragStartY = e.clientY; dragStartPeel = targetPeel;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!dragging || calibrating) return;
  const dy = dragStartY - e.clientY;
  targetPeel = Math.min(1, Math.max(0, dragStartPeel + dy / 160));
  slider.value = Math.round(targetPeel * 100);
});
renderer.domElement.addEventListener('pointerup', () => dragging = false);
renderer.domElement.addEventListener('pointercancel', () => dragging = false);
slider.addEventListener('input', () => { autoDemo = false; targetPeel = slider.value / 100; });

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  updateCameraFraming();
});

if (!calibrating) camera.lookAt(initialTarget);

function animate() {
  peel += (targetPeel - peel) * 0.2;
  if (autoDemo) {
    autoT += 0.013;
    targetPeel = (Math.sin(autoT) + 1) / 2;
    slider.value = Math.round(targetPeel * 100);
  }
  readout.textContent = Math.round(peel * 100) + '%';

  applyCurl(peel);

  if (calibrating) { orbitControls.update(); updateCalibReadout(); }

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
