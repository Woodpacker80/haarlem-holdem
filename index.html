<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Haarlem Hold'em — Squeeze Prototype</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --cobalt-deep:    #0a0e1a;
    --cobalt-mid:     #0d1530;
    --cobalt-felt:    #111d3c;
    --cobalt-rim:     #1a2a5e;
    --cobalt-glow:    #2244cc;
    --gold:           #c9a84c;
    --gold-light:     #f0d080;
    --card-white:     #f8f4ee;
    --card-back-dark: #1a1060;
    --card-back-mid:  #2a1888;
    --card-back-light:#3a28a8;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--cobalt-deep);
    overflow: hidden;
    font-family: 'Montserrat', sans-serif;
    touch-action: none;
  }

  /* Subtle felt texture via radial gradient */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(34,68,204,0.08) 0%, transparent 70%),
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,0.012) 2px,
        rgba(255,255,255,0.012) 4px
      );
    pointer-events: none;
    z-index: 0;
  }

  #ui {
    position: relative; z-index: 1;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0;
  }

  /* Player name strip */
  #player-strip {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 18px 24px 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  #player-name {
    font-size: 13px; font-weight: 600; letter-spacing: 0.18em;
    color: rgba(255,255,255,0.45); text-transform: uppercase;
  }
  #chip-count {
    font-size: 13px; font-weight: 700; letter-spacing: 0.08em;
    color: var(--gold); 
  }

  /* Card stage */
  #card-stage {
    position: relative;
    width: 200px; height: 280px;
    margin-bottom: 20px;
  }

  /* The card face — static, always underneath */
  #card-face {
    position: absolute; inset: 0;
    border-radius: 12px;
    background: var(--card-white);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    box-shadow: 0 8px 32px rgba(0,0,0,0.7), 0 2px 8px rgba(0,0,0,0.5);
    overflow: hidden;
    user-select: none;
  }
  #card-face::before {
    content: '';
    position: absolute; inset: 6px;
    border: 1.5px solid rgba(0,0,0,0.08);
    border-radius: 8px;
    pointer-events: none;
  }

  .face-corner {
    position: absolute;
    display: flex; flex-direction: column; align-items: center;
    line-height: 1;
  }
  .face-corner.tl { top: 10px; left: 12px; }
  .face-corner.br { bottom: 10px; right: 12px; transform: rotate(180deg); }

  .face-rank {
    font-family: 'Georgia', serif;
    font-size: 22px; font-weight: bold;
    color: #111; line-height: 1;
  }
  .face-suit-small {
    font-size: 14px; line-height: 1; margin-top: 1px;
    color: #111;
  }
  .face-suit-big {
    font-size: 88px; line-height: 1;
    color: #111;
    text-shadow: 0 2px 6px rgba(0,0,0,0.12);
    margin-top: -8px;
  }

  /* Canvas overlaid exactly on the card stage */
  #squeeze-canvas {
    position: absolute; inset: 0;
    border-radius: 12px;
    touch-action: none;
    cursor: default;
  }

  /* Anchor point indicators */
  .anchor-hint {
    position: absolute;
    bottom: -22px;
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.04);
    transition: opacity 0.3s, border-color 0.3s;
  }
  .anchor-hint::after {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
  }
  .anchor-hint.left  { left: 10px; }
  .anchor-hint.right { right: 10px; }
  .anchor-hint.center { left: 50%; transform: translateX(-50%); }
  .anchor-hint.active {
    border-color: var(--gold);
    background: rgba(201,168,76,0.12);
  }
  .anchor-hint.active::after { background: var(--gold); }

  /* Instruction label */
  #hint {
    margin-top: 44px;
    font-size: 11px; font-weight: 400; letter-spacing: 0.2em;
    color: rgba(255,255,255,0.22); text-transform: uppercase;
    text-align: center;
    transition: opacity 0.4s;
  }
  #hint.hidden { opacity: 0; }

  /* Bottom action bar */
  #action-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 16px 20px 28px;
    display: flex; gap: 10px;
  }
  .action-btn {
    flex: 1; padding: 13px 6px;
    border-radius: 8px; border: none;
    font-family: 'Montserrat', sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; cursor: pointer;
    transition: transform 0.1s, opacity 0.1s;
  }
  .action-btn:active { transform: scale(0.96); opacity: 0.85; }
  .btn-fold  { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4); }
  .btn-check { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4); }
  .btn-call  { background: rgba(34,68,204,0.5);   color: #fff; border: 1px solid var(--cobalt-glow); }
  .btn-raise { background: var(--gold);            color: #111; }

</style>
</head>
<body>

<div id="ui">
  <div id="player-strip">
    <span id="player-name">Bond</span>
    <span id="chip-count">€ 7,500</span>
  </div>

  <div id="card-stage">
    <!-- Static face always underneath -->
    <div id="card-face">
      <div class="face-corner tl">
        <div class="face-rank">A</div>
        <div class="face-suit-small">♠</div>
      </div>
      <div class="face-suit-big">♠</div>
      <div class="face-corner br">
        <div class="face-rank">A</div>
        <div class="face-suit-small">♠</div>
      </div>
    </div>

    <!-- Canvas draws the peeling card back -->
    <canvas id="squeeze-canvas"></canvas>

    <!-- Anchor hints below the card -->
    <div class="anchor-hint left"  id="hint-left"></div>
    <div class="anchor-hint center" id="hint-center"></div>
    <div class="anchor-hint right" id="hint-right"></div>
  </div>

  <div id="hint">Hold an anchor point to peek</div>

  <div id="action-bar">
    <button class="action-btn btn-fold">Fold</button>
    <button class="action-btn btn-check">Check</button>
    <button class="action-btn btn-call">Call €100</button>
    <button class="action-btn btn-raise">Raise</button>
  </div>
</div>

<script>
// ─── Canvas Setup ───────────────────────────────────────────────────────────
const canvas  = document.getElementById('squeeze-canvas');
const ctx     = canvas.getContext('2d');
const stage   = document.getElementById('card-stage');

function resize() {
  const r = stage.getBoundingClientRect();
  canvas.width  = r.width;
  canvas.height = r.height;
  drawBack(0, null, null); // draw flat back initially
}
window.addEventListener('resize', resize);
resize();

// ─── Card dimensions (match CSS) ────────────────────────────────────────────
const W = () => canvas.width;
const H = () => canvas.height;
const RADIUS = 12;

// ─── Three anchor points (relative to card) ─────────────────────────────────
// Each anchor: { id, getX(), getY(), hintEl }
const anchors = [
  { id: 'left',   getX: () => W() * 0.12,  getY: () => H(), hintEl: document.getElementById('hint-left')   },
  { id: 'center', getX: () => W() * 0.50,  getY: () => H(), hintEl: document.getElementById('hint-center') },
  { id: 'right',  getX: () => W() * 0.88,  getY: () => H(), hintEl: document.getElementById('hint-right')  },
];
const ANCHOR_RADIUS = 44; // px, touch hit area

// ─── State ───────────────────────────────────────────────────────────────────
let activeAnchor = null;
let touchId      = null;
let dragY        = 0;  // current touch Y relative to canvas
let dragX        = 0;
let peelAmount   = 0;  // 0 = flat, 1 = fully peeled
let animFrame    = null;
let snapAnim     = null;

const hintEl  = document.getElementById('hint');

// ─── Gradient builders ───────────────────────────────────────────────────────
function makeBackGradient() {
  const g = ctx.createLinearGradient(0, 0, W(), H());
  g.addColorStop(0,   '#1a1060');
  g.addColorStop(0.5, '#2a1888');
  g.addColorStop(1,   '#1a1060');
  return g;
}

function makeShineGradient(peelFraction) {
  // Subtle sheen that moves as the card peels
  const cy = H() * (1 - peelFraction * 0.6);
  const g = ctx.createRadialGradient(W()*0.5, cy, 0, W()*0.5, cy, W()*0.9);
  g.addColorStop(0,   `rgba(255,255,255,${0.06 + peelFraction * 0.04})`);
  g.addColorStop(0.5, 'rgba(255,255,255,0.01)');
  g.addColorStop(1,   'rgba(0,0,0,0.0)');
  return g;
}

// ─── Draw the flat card back ─────────────────────────────────────────────────
function drawBack(peel, anchorX, touchX) {
  ctx.clearRect(0, 0, W(), H());

  if (peel <= 0.001) {
    // Perfectly flat — simple rounded rect
    drawFlatBack();
    return;
  }

  // Compute the curl geometry
  drawCurledBack(peel, anchorX, touchX);
}

function roundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawFlatBack() {
  // Shadow
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.65)';
  ctx.shadowBlur  = 28;
  ctx.shadowOffsetY = 8;
  roundedRect(0, 0, W(), H(), RADIUS);
  ctx.fillStyle = makeBackGradient();
  ctx.fill();
  ctx.restore();

  // Pattern
  drawBackPattern(0, 0, W(), H(), 1.0);

  // Shine
  roundedRect(0, 0, W(), H(), RADIUS);
  ctx.fillStyle = makeShineGradient(0);
  ctx.fill();

  // Border
  roundedRect(0, 0, W(), H(), RADIUS);
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

// ─── The curl algorithm ──────────────────────────────────────────────────────
// We split the card into two regions:
//   1. The "peeled" portion above the fold line — drawn curled using bezier
//   2. The remaining flat portion — drawn normally
// The fold line rises from the anchor point upward as peel increases.

function drawCurledBack(peel, anchorX, touchX) {
  const w = W(), h = H();

  // How far up has the fold risen? (0 = bottom, h = top)
  const foldRise = peel * h * 0.82;
  // The fold line Y coordinate (from top)
  const foldY = h - foldRise;

  // The lateral lean: peeling from left leans left, right leans right, center is straight
  const leanFactor = (anchorX / w - 0.5) * 2; // -1 to +1
  const foldXOffset = leanFactor * foldRise * 0.35;

  // The top of the peel (where the curled tip ends up)
  const tipX = anchorX + (touchX - anchorX) * 0.3 + foldXOffset * 0.5;
  const tipY = foldY - foldRise * 0.55 * peel;

  // ── Draw the flat bottom portion ──────────────────────────────────────────
  ctx.save();
  ctx.beginPath();
  // Left edge down to fold
  ctx.moveTo(0, RADIUS);
  ctx.quadraticCurveTo(0, 0, RADIUS, 0);
  ctx.lineTo(w - RADIUS, 0);
  ctx.quadraticCurveTo(w, 0, w, RADIUS);
  ctx.lineTo(w, foldY + foldXOffset * Math.sign(-leanFactor) * 0.5);
  // The fold bottom curve — a gentle arc across the card width
  ctx.bezierCurveTo(
    w * 0.75, foldY + 12 * peel,
    w * 0.25, foldY + 12 * peel,
    0,        foldY - foldXOffset * Math.sign(leanFactor) * 0.5
  );
  ctx.closePath();
  ctx.clip();

  // Shadow beneath card
  ctx.shadowColor = 'rgba(0,0,0,0.7)';
  ctx.shadowBlur  = 28;
  ctx.shadowOffsetY = 10;
  roundedRect(0, 0, w, h, RADIUS);
  ctx.fillStyle = makeBackGradient();
  ctx.fill();
  ctx.shadowColor = 'transparent';
  drawBackPattern(0, 0, w, h, 1.0);
  roundedRect(0, 0, w, h, RADIUS);
  ctx.fillStyle = makeShineGradient(peel * 0.3);
  ctx.fill();
  ctx.restore();

  // ── Draw the curled/peeled flap ───────────────────────────────────────────
  // This is the portion that has been lifted — it shows the card back
  // curling, with a slight lightening on its underside edge (the face peeking)

  ctx.save();

  // The flap is drawn as a curved shape using bezier paths
  // It rises from the fold line and curls back toward the viewer

  const curlDepth = peel * h * 0.45; // how much vertical curl
  const curlNarrow = peel * w * 0.08; // the flap narrows as it curls

  // Left edge of flap at fold
  const flapBL_x = 0 + curlNarrow * 0.5;
  const flapBL_y = foldY - foldXOffset * Math.sign(leanFactor) * 0.5;
  // Right edge of flap at fold
  const flapBR_x = w - curlNarrow * 0.5;
  const flapBR_y = foldY + foldXOffset * Math.sign(-leanFactor) * 0.5;
  // Top left (curled tip area)
  const flapTL_x = flapBL_x + curlNarrow + leanFactor * curlDepth * 0.2;
  const flapTL_y = flapBL_y - curlDepth;
  // Top right
  const flapTR_x = flapBR_x - curlNarrow - leanFactor * curlDepth * 0.2;
  const flapTR_y = flapBR_y - curlDepth;

  // Build path for the flap
  ctx.beginPath();
  ctx.moveTo(flapBL_x, flapBL_y);
  // bottom of flap — gentle curve
  ctx.bezierCurveTo(
    w * 0.25, flapBL_y + 10 * peel,
    w * 0.75, flapBR_y + 10 * peel,
    flapBR_x, flapBR_y
  );
  // right side going up
  ctx.bezierCurveTo(
    flapBR_x - 5, flapBR_y - curlDepth * 0.4,
    flapTR_x + 8, flapTR_y + curlDepth * 0.2,
    flapTR_x, flapTR_y
  );
  // top of flap — curves toward tip
  ctx.bezierCurveTo(
    w * 0.7 + leanFactor * 10, flapTR_y - 6 * peel,
    w * 0.3 + leanFactor * 10, flapTL_y - 6 * peel,
    flapTL_x, flapTL_y
  );
  // left side going down
  ctx.bezierCurveTo(
    flapTL_x - 8, flapTL_y + curlDepth * 0.2,
    flapBL_x + 5, flapBL_y - curlDepth * 0.4,
    flapBL_x, flapBL_y
  );
  ctx.closePath();

  // Clip to flap shape
  ctx.clip();

  // Shadow cast by the lifted flap onto the flat part below
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur  = 16 * peel;
  ctx.shadowOffsetY = 6 * peel;

  // Fill the flap with card back color (slightly lighter = catching light)
  const flapGrad = ctx.createLinearGradient(0, flapBL_y, 0, flapTL_y);
  flapGrad.addColorStop(0,   '#3a28b8'); // fold edge — brightest (catching light)
  flapGrad.addColorStop(0.3, '#2a1888');
  flapGrad.addColorStop(1,   '#1e1570'); // tip — slightly darker
  ctx.fillStyle = flapGrad;
  ctx.fillRect(0, 0, w, h);
  ctx.shadowColor = 'transparent';

  // Draw pattern on the flap (slightly transformed to show curl)
  drawBackPattern(0, 0, w, h, 1 - peel * 0.15);

  // The "underside" glow along the fold edge — this simulates
  // the card face color peeking around the bend
  const edgeGrad = ctx.createLinearGradient(0, flapBL_y, 0, flapBL_y + 18);
  edgeGrad.addColorStop(0,   `rgba(248,244,238,${peel * 0.55})`);
  edgeGrad.addColorStop(0.4, `rgba(248,244,238,${peel * 0.15})`);
  edgeGrad.addColorStop(1,   'rgba(248,244,238,0)');
  ctx.fillStyle = edgeGrad;
  ctx.fillRect(0, flapBL_y - 2, w, 22);

  // Specular sheen on the curl surface
  const sheenGrad = ctx.createLinearGradient(0, flapTL_y, 0, flapBL_y);
  sheenGrad.addColorStop(0,   `rgba(255,255,255,${peel * 0.18})`);
  sheenGrad.addColorStop(0.5, `rgba(255,255,255,${peel * 0.06})`);
  sheenGrad.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.fillStyle = sheenGrad;
  ctx.fillRect(0, flapTL_y, w, flapBL_y - flapTL_y);

  ctx.restore();

  // Border on full card
  roundedRect(0, 0, w, h, RADIUS);
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

// ─── Card back pattern (diamond grid) ───────────────────────────────────────
function drawBackPattern(x, y, w, h, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha * 0.18;
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 0.8;

  const spacing = 14;
  // Diagonal lines one way
  for (let i = -h; i < w + h; i += spacing) {
    ctx.beginPath();
    ctx.moveTo(x + i, y);
    ctx.lineTo(x + i - h, y + h);
    ctx.stroke();
  }
  // Diagonal lines other way
  for (let i = -h; i < w + h; i += spacing) {
    ctx.beginPath();
    ctx.moveTo(x + i, y);
    ctx.lineTo(x + i + h, y + h);
    ctx.stroke();
  }

  // Center logo pip
  ctx.globalAlpha = alpha * 0.22;
  ctx.font = `bold ${Math.floor(w * 0.28)}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillText('♠', x + w / 2, y + h / 2);

  ctx.restore();
}

// ─── Touch handling ──────────────────────────────────────────────────────────
function getCanvasPos(touch) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: touch.clientX - rect.left,
    y: touch.clientY - rect.top,
  };
}

function findAnchor(x, y) {
  // Only trigger if touch is in the bottom 30% of the card
  if (y < H() * 0.70) return null;
  for (const a of anchors) {
    const dx = x - a.getX();
    const dy = y - a.getY();
    if (Math.sqrt(dx*dx + dy*dy) < ANCHOR_RADIUS) return a;
  }
  return null;
}

canvas.addEventListener('touchstart', e => {
  if (activeAnchor) return;
  const t = e.changedTouches[0];
  const pos = getCanvasPos(t);
  const found = findAnchor(pos.x, pos.y);
  if (!found) return;

  e.preventDefault();
  activeAnchor = found;
  touchId = t.identifier;
  dragX = pos.x;
  dragY = pos.y;
  peelAmount = 0;

  // Highlight anchor hint
  anchors.forEach(a => a.hintEl.classList.remove('active'));
  found.hintEl.classList.add('active');
  hintEl.classList.add('hidden');

  cancelSnap();
  requestAnimationFrame(renderLoop);
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  if (!activeAnchor) return;
  e.preventDefault();

  for (const t of e.changedTouches) {
    if (t.identifier !== touchId) continue;
    const pos = getCanvasPos(t);
    dragX = pos.x;
    dragY = pos.y;

    // How far upward from the bottom of the card?
    const upwardDrag = Math.max(0, H() - pos.y);
    // Normalize: full card height of drag = peel of 1
    peelAmount = Math.min(1, upwardDrag / (H() * 0.75));
  }
}, { passive: false });

function onTouchEnd(e) {
  if (!activeAnchor) return;
  for (const t of e.changedTouches) {
    if (t.identifier !== touchId) continue;
    startSnap();
    anchors.forEach(a => a.hintEl.classList.remove('active'));
    activeAnchor = null;
    touchId = null;
    break;
  }
}
canvas.addEventListener('touchend',    onTouchEnd);
canvas.addEventListener('touchcancel', onTouchEnd);

// ─── Snap-back animation ─────────────────────────────────────────────────────
function startSnap() {
  cancelSnap();
  const startPeel = peelAmount;
  const startTime = performance.now();
  const duration  = 220; // ms — snappy

  function step(now) {
    const t = Math.min(1, (now - startTime) / duration);
    // Ease out cubic
    const eased = 1 - Math.pow(1 - t, 3);
    peelAmount = startPeel * (1 - eased);
    drawBack(peelAmount, activeAnchor ? activeAnchor.getX() : W() * 0.5, dragX);

    if (t < 1) {
      snapAnim = requestAnimationFrame(step);
    } else {
      peelAmount = 0;
      drawBack(0, null, null);
      hintEl.classList.remove('hidden');
    }
  }
  snapAnim = requestAnimationFrame(step);
}

function cancelSnap() {
  if (snapAnim) { cancelAnimationFrame(snapAnim); snapAnim = null; }
}

// ─── Render loop (while dragging) ───────────────────────────────────────────
function renderLoop() {
  if (!activeAnchor) return;
  drawBack(peelAmount, activeAnchor.getX(), dragX);
  requestAnimationFrame(renderLoop);
}

// ─── Mouse fallback for desktop testing ─────────────────────────────────────
let mouseDown = false;
canvas.addEventListener('mousedown', e => {
  const rect = canvas.getBoundingClientRect();
  const pos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  const found = findAnchor(pos.x, pos.y);
  if (!found) return;
  mouseDown = true;
  activeAnchor = found;
  dragX = pos.x; dragY = pos.y;
  peelAmount = 0;
  anchors.forEach(a => a.hintEl.classList.remove('active'));
  found.hintEl.classList.add('active');
  hintEl.classList.add('hidden');
  cancelSnap();
  requestAnimationFrame(renderLoop);
});
canvas.addEventListener('mousemove', e => {
  if (!mouseDown || !activeAnchor) return;
  const rect = canvas.getBoundingClientRect();
  dragX = e.clientX - rect.left;
  dragY = e.clientY - rect.top;
  const upwardDrag = Math.max(0, H() - dragY);
  peelAmount = Math.min(1, upwardDrag / (H() * 0.75));
});
canvas.addEventListener('mouseup', () => {
  if (!mouseDown) return;
  mouseDown = false;
  startSnap();
  anchors.forEach(a => a.hintEl.classList.remove('active'));
  activeAnchor = null;
});

// ─── Init ────────────────────────────────────────────────────────────────────
resize();
</script>
</body>
</html>
