<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Haarlem Hold'em — Squeeze</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root { --cobalt-deep:#080c18; --gold:#c9a84c; --card-cream:#f8f4ee; }
  html, body {
    width:100%; height:100%; background:var(--cobalt-deep);
    overflow:hidden; font-family:'Montserrat',sans-serif;
    touch-action:none; -webkit-user-select:none; user-select:none;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(26,42,94,0.35) 0%, transparent 65%),
      repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,0.012) 3px,rgba(255,255,255,0.012) 4px),
      repeating-linear-gradient(90deg,transparent,transparent 3px,rgba(255,255,255,0.007) 3px,rgba(255,255,255,0.007) 4px);
    pointer-events:none; z-index:0;
  }
  #ui { position:relative; z-index:1; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #player-strip { position:absolute; top:0; left:0; right:0; padding:20px 24px 0; display:flex; align-items:center; justify-content:space-between; }
  #player-name { font-size:12px; font-weight:600; letter-spacing:0.22em; color:rgba(255,255,255,0.38); text-transform:uppercase; }
  #chip-count  { font-size:13px; font-weight:700; letter-spacing:0.08em; color:var(--gold); }
  #card-stage  { position:relative; width:200px; height:280px; }
  #card-face {
    position:absolute; inset:0; border-radius:12px; background:var(--card-cream);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    box-shadow:0 12px 40px rgba(0,0,0,0.75),0 2px 8px rgba(0,0,0,0.5); overflow:hidden;
  }
  #card-face::before { content:''; position:absolute; inset:6px; border:1.5px solid rgba(0,0,0,0.07); border-radius:7px; pointer-events:none; }
  .face-corner { position:absolute; display:flex; flex-direction:column; align-items:center; line-height:1; }
  .face-corner.tl { top:10px; left:11px; }
  .face-corner.br { bottom:10px; right:11px; transform:rotate(180deg); }
  .face-rank    { font-family:'Georgia',serif; font-size:22px; font-weight:bold; color:#111; }
  .face-suit-sm { font-size:14px; color:#111; margin-top:1px; }
  .face-suit-lg { font-size:90px; color:#111; margin-top:-8px; line-height:1; }
  #squeeze-canvas { position:absolute; inset:0; touch-action:none; border-radius:12px; display:block; }
  .anchor-dot {
    position:absolute; bottom:-26px; width:32px; height:32px; border-radius:50%;
    border:1.5px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.03);
    display:flex; align-items:center; justify-content:center; pointer-events:none;
    transition:border-color 0.25s,background 0.25s;
  }
  .anchor-dot::after { content:''; width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,0.22); transition:background 0.25s; }
  .anchor-dot.left   { left:8px; }
  .anchor-dot.center { left:50%; transform:translateX(-50%); }
  .anchor-dot.right  { right:8px; }
  .anchor-dot.active { border-color:var(--gold); background:rgba(201,168,76,0.10); }
  .anchor-dot.active::after { background:var(--gold); }
  #hint { margin-top:50px; font-size:10px; font-weight:500; letter-spacing:0.24em; color:rgba(255,255,255,0.18); text-transform:uppercase; text-align:center; transition:opacity 0.35s; }
  #hint.hidden { opacity:0; }
  #action-bar { position:absolute; bottom:0; left:0; right:0; padding:14px 16px 32px; display:flex; gap:9px; }
  .action-btn { flex:1; padding:14px 4px; border-radius:9px; border:none; font-family:'Montserrat',sans-serif; font-size:10px; font-weight:700; letter-spacing:0.13em; text-transform:uppercase; cursor:pointer; transition:transform 0.1s,opacity 0.1s; }
  .action-btn:active { transform:scale(0.95); opacity:0.8; }
  .btn-fold  { background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.35); }
  .btn-check { background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.35); }
  .btn-call  { background:rgba(30,60,180,0.55); color:#fff; border:1px solid rgba(80,120,255,0.4); }
  .btn-raise { background:var(--gold); color:#111; }
</style>
</head>
<body>
<div id="ui">
  <div id="player-strip">
    <span id="player-name">Bond</span>
    <span id="chip-count">€ 7,500</span>
  </div>
  <div id="card-stage">
    <div id="card-face">
      <div class="face-corner tl"><div class="face-rank">A</div><div class="face-suit-sm">♠</div></div>
      <div class="face-suit-lg">♠</div>
      <div class="face-corner br"><div class="face-rank">A</div><div class="face-suit-sm">♠</div></div>
    </div>
    <canvas id="squeeze-canvas"></canvas>
    <div class="anchor-dot left"   id="dot-left"></div>
    <div class="anchor-dot center" id="dot-center"></div>
    <div class="anchor-dot right"  id="dot-right"></div>
  </div>
  <div id="hint">Hold bottom edge to peek</div>
  <div id="action-bar">
    <button class="action-btn btn-fold">Fold</button>
    <button class="action-btn btn-check">Check</button>
    <button class="action-btn btn-call">Call €100</button>
    <button class="action-btn btn-raise">Raise</button>
  </div>
</div>

<script>
window.addEventListener('load', function () {

  const canvas  = document.getElementById('squeeze-canvas');
  const ctx     = canvas.getContext('2d');
  const stage   = document.getElementById('card-stage');
  const hintEl  = document.getElementById('hint');
  const RADIUS  = 12;

  // Off-screen canvas — card back baked here once, reused for peeling
  const osc = document.createElement('canvas');
  const octx = osc.getContext('2d');
  let backReady = false;

  // ── Resize ────────────────────────────────────────────────────────────────
  function resize() {
    const r = stage.getBoundingClientRect();
    canvas.width  = Math.round(r.width)  || 200;
    canvas.height = Math.round(r.height) || 280;
    osc.width  = canvas.width;
    osc.height = canvas.height;
    bakeBack();
  }

  // ═══════════════════════════════════════════════════════════════════════════
  //  BAKE: render ornate SVG card back → offscreen canvas
  // ═══════════════════════════════════════════════════════════════════════════
  function bakeBack() {
    const w = osc.width, h = osc.height;
    backReady = false;

    const svgStr = makeSVG(w, h);
    const blob   = new Blob([svgStr], { type:'image/svg+xml;charset=utf-8' });
    const url    = URL.createObjectURL(blob);
    const img    = new Image();

    img.onload = function() {
      octx.clearRect(0, 0, w, h);
      octx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      backReady = true;
      if (!activeAnchor && !snapRunning) drawFlat();
    };
    img.onerror = function() {
      URL.revokeObjectURL(url);
      bakeBackFallback(w, h);
    };
    img.src = url;
  }

  // ── Fallback: pure canvas if SVG blob fails ───────────────────────────────
  function bakeBackFallback(w, h) {
    octx.clearRect(0, 0, w, h);
    octxRrect(0, 0, w, h, RADIUS);
    octx.fillStyle = '#8B0000'; octx.fill();
    octx.save(); octxRrect(0,0,w,h,RADIUS); octx.clip();
    octx.strokeStyle='rgba(255,255,255,0.5)'; octx.lineWidth=0.8;
    for(let i=-h;i<w+h;i+=13){
      octx.beginPath(); octx.moveTo(i,0); octx.lineTo(i-h,h); octx.stroke();
      octx.beginPath(); octx.moveTo(i,0); octx.lineTo(i+h,h); octx.stroke();
    }
    octx.restore();
    octx.strokeStyle='white'; octx.lineWidth=2.5;
    octxRrect(7,7,w-14,h-14,RADIUS-4); octx.stroke();
    backReady = true;
    if (!activeAnchor && !snapRunning) drawFlat();
  }

  function octxRrect(x,y,w,h,r) {
    octx.beginPath();
    octx.moveTo(x+r,y); octx.lineTo(x+w-r,y);
    octx.arcTo(x+w,y,x+w,y+r,r); octx.lineTo(x+w,y+h-r);
    octx.arcTo(x+w,y+h,x+w-r,y+h,r); octx.lineTo(x+r,y+h);
    octx.arcTo(x,y+h,x,y+h-r,r); octx.lineTo(x,y+r);
    octx.arcTo(x,y,x+r,y,r); octx.closePath();
  }

  // ═══════════════════════════════════════════════════════════════════════════
  //  SVG: Victorian scroll card back
  //  Strategy: red base + dense WHITE filigree so card reads as red-AND-white
  // ═══════════════════════════════════════════════════════════════════════════
  function makeSVG(w, h) {
    const cx=w/2, cy=h/2, R=RADIUS;
    const bdr=7;

    // Tile cell for the repeating scroll field
    // Each tile is 32×44px in its own coordinate space
    const tW=32, tH=44;
    const cols=Math.ceil(w/tW)+2, rows=Math.ceil(h/tH)+2;

    let tiles='';
    for(let row=-1; row<=rows; row++){
      const stagger = (row%2===0) ? 0 : tW*0.5;
      for(let col=-1; col<=cols; col++){
        const tx = col*tW + stagger;
        const ty = row*tH;
        tiles += `<use href="#sc" x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" width="${tW}" height="${tH}"/>`;
      }
    }

    // Medallion spokes
    let spokes='', mR=Math.min(w,h)*0.185;
    for(let i=0;i<24;i++){
      const a=(i/24)*Math.PI*2;
      spokes+=`<line x1="${(cx+Math.cos(a)*mR*0.35).toFixed(1)}" y1="${(cy+Math.sin(a)*mR*0.35).toFixed(1)}"
                     x2="${(cx+Math.cos(a)*mR).toFixed(1)}"       y2="${(cy+Math.sin(a)*mR).toFixed(1)}"
                     stroke="white" stroke-width="0.9" opacity="0.72"/>`;
    }
    let petals='';
    for(let i=0;i<12;i++){
      const a=(i/12)*Math.PI*2;
      const px=(cx+Math.cos(a)*mR*0.60).toFixed(1);
      const py=(cy+Math.sin(a)*mR*0.60).toFixed(1);
      const deg=((a*180/Math.PI)+90).toFixed(1);
      petals+=`<ellipse cx="${px}" cy="${py}" rx="${(mR*0.085).toFixed(1)}" ry="${(mR*0.19).toFixed(1)}"
        transform="rotate(${deg} ${px} ${py})" fill="white" opacity="0.32" stroke="white" stroke-width="0.6" stroke-opacity="0.65"/>`;
    }

    // Corner ornament helper
    function corner(x,y,r,flip){
      const f=flip?-1:1;
      return `<g>
        <path d="M${x},${y} C${x+f*r*0.7},${y-r*0.1} ${x+f*r*0.9},${y-r*0.65} ${x+f*r*0.5},${y-r*0.92}
                 C${x+f*r*0.2},${y-r*1.1} ${x},${y-r} ${x},${y-r*0.62}"
              fill="none" stroke="white" stroke-width="1.2" opacity="0.80"/>
        <path d="M${x},${y} C${x-f*r*0.7},${y-r*0.1} ${x-f*r*0.9},${y-r*0.65} ${x-f*r*0.5},${y-r*0.92}
                 C${x-f*r*0.2},${y-r*1.1} ${x},${y-r} ${x},${y-r*0.62}"
              fill="none" stroke="white" stroke-width="1.2" opacity="0.80"/>
        <circle cx="${x}" cy="${y}" r="${r*0.26}" fill="none" stroke="white" stroke-width="0.9" opacity="0.70"/>
        <circle cx="${x}" cy="${y}" r="${r*0.13}" fill="white" opacity="0.80"/>
        <circle cx="${x}" cy="${y}" r="${r*0.055}" fill="#8B0000"/>
      </g>`;
    }
    const cr=Math.min(w,h)*0.082, cp=bdr+13;
    const corners=
      corner(cp,     cp,     cr,false)+
      corner(w-cp,   cp,     cr,false)+
      corner(cp,     h-cp,   cr,true)+
      corner(w-cp,   h-cp,   cr,true);

    return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" shape-rendering="geometricPrecision">
<defs>
  <clipPath id="cc"><rect x="0" y="0" width="${w}" height="${h}" rx="${R}" ry="${R}"/></clipPath>

  <!-- SCROLL TILE: white-dominant filigree on transparent -->
  <symbol id="sc" viewBox="0 0 32 44" preserveAspectRatio="none">
    <!-- Outer oval/diamond -->
    <path d="M16,1 C22,1 31,10 31,22 C31,34 22,43 16,43 C10,43 1,34 1,22 C1,10 10,1 16,1 Z"
          fill="none" stroke="white" stroke-width="1.1" opacity="0.72"/>
    <!-- Four-leaf scroll interior -->
    <path d="M16,8 C19,12 24,14 24,18 C24,22 20,23 16,22" fill="none" stroke="white" stroke-width="1.0" opacity="0.85"/>
    <path d="M16,8 C13,12 8,14 8,18 C8,22 12,23 16,22"  fill="none" stroke="white" stroke-width="1.0" opacity="0.85"/>
    <path d="M16,36 C19,32 24,30 24,26 C24,22 20,21 16,22" fill="none" stroke="white" stroke-width="1.0" opacity="0.85"/>
    <path d="M16,36 C13,32 8,30 8,26 C8,22 12,21 16,22"  fill="none" stroke="white" stroke-width="1.0" opacity="0.85"/>
    <!-- Horizontal & vertical arms -->
    <line x1="1" y1="22" x2="7"  y2="22" stroke="white" stroke-width="0.7" opacity="0.60"/>
    <line x1="25" y1="22" x2="31" y2="22" stroke="white" stroke-width="0.7" opacity="0.60"/>
    <line x1="16" y1="1"  x2="16" y2="7"  stroke="white" stroke-width="0.7" opacity="0.60"/>
    <line x1="16" y1="37" x2="16" y2="43" stroke="white" stroke-width="0.7" opacity="0.60"/>
    <!-- Tiny diagonal flourishes at the four intercardinal points -->
    <path d="M7,11 C9,10 11,9 11,11" fill="none" stroke="white" stroke-width="0.7" opacity="0.55"/>
    <path d="M25,11 C23,10 21,9 21,11" fill="none" stroke="white" stroke-width="0.7" opacity="0.55"/>
    <path d="M7,33 C9,34 11,35 11,33" fill="none" stroke="white" stroke-width="0.7" opacity="0.55"/>
    <path d="M25,33 C23,34 21,35 21,33" fill="none" stroke="white" stroke-width="0.7" opacity="0.55"/>
    <!-- Center rosette -->
    <circle cx="16" cy="22" r="3.2" fill="white" opacity="0.78"/>
    <circle cx="16" cy="22" r="1.8" fill="#8B0000"/>
    <circle cx="16" cy="22" r="0.8" fill="white" opacity="0.95"/>
    <!-- Midpoint accent dots -->
    <circle cx="16" cy="15" r="1.0" fill="white" opacity="0.55"/>
    <circle cx="16" cy="29" r="1.0" fill="white" opacity="0.55"/>
    <circle cx="9"  cy="22" r="1.0" fill="white" opacity="0.55"/>
    <circle cx="23" cy="22" r="1.0" fill="white" opacity="0.55"/>
  </symbol>

  <radialGradient id="vig" cx="50%" cy="42%" r="62%">
    <stop offset="0%"   stop-color="#A01212" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#4A0000" stop-opacity="0.60"/>
  </radialGradient>
  <radialGradient id="shn" cx="36%" cy="20%" r="52%">
    <stop offset="0%"   stop-color="white" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="white" stop-opacity="0.00"/>
  </radialGradient>
</defs>

<g clip-path="url(#cc)">
  <!-- Red base -->
  <rect width="${w}" height="${h}" fill="#8B0000"/>

  <!-- Scroll tile field -->
  <g opacity="1">${tiles}</g>

  <!-- Depth vignette -->
  <rect width="${w}" height="${h}" fill="url(#vig)"/>

  <!-- Outer white border -->
  <rect x="${bdr}" y="${bdr}" width="${w-bdr*2}" height="${h-bdr*2}"
        rx="${R-3}" ry="${R-3}" fill="none" stroke="white" stroke-width="2.8" opacity="0.96"/>
  <!-- Inner fine border -->
  <rect x="${bdr+6}" y="${bdr+6}" width="${w-bdr*2-12}" height="${h-bdr*2-12}"
        rx="${R-6}" ry="${R-6}" fill="none" stroke="white" stroke-width="0.85" opacity="0.50"/>

  <!-- Central medallion -->
  <circle cx="${cx}" cy="${cy}" r="${mR}" fill="none" stroke="white" stroke-width="1.4" opacity="0.72"/>
  ${spokes}
  ${petals}
  <circle cx="${cx}" cy="${cy}" r="${(mR*0.40).toFixed(1)}" fill="none" stroke="white" stroke-width="1.1" opacity="0.78"/>
  <circle cx="${cx}" cy="${cy}" r="${(mR*0.26).toFixed(1)}" fill="none" stroke="white" stroke-width="0.8" opacity="0.68"/>
  <circle cx="${cx}" cy="${cy}" r="${(mR*0.14).toFixed(1)}" fill="#8B0000" stroke="white" stroke-width="1.1" stroke-opacity="0.85"/>
  <circle cx="${cx}" cy="${cy}" r="${(mR*0.06).toFixed(1)}" fill="white" opacity="0.92"/>

  <!-- Corner ornaments -->
  ${corners}

  <!-- Specular sheen -->
  <rect width="${w}" height="${h}" fill="url(#shn)"/>
</g>
</svg>`;
  }

  // ═══════════════════════════════════════════════════════════════════════════
  //  CANVAS DRAW FUNCTIONS
  // ═══════════════════════════════════════════════════════════════════════════
  function rrect(x,y,w,h,r) {
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
    ctx.arcTo(x+w,y,x+w,y+r,r); ctx.lineTo(x+w,y+h-r);
    ctx.arcTo(x+w,y+h,x+w-r,y+h,r); ctx.lineTo(x+r,y+h);
    ctx.arcTo(x,y+h,x,y+h-r,r); ctx.lineTo(x,y+r);
    ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
  }

  function drawFlat() {
    const w=canvas.width, h=canvas.height;
    ctx.clearRect(0,0,w,h);
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.80)'; ctx.shadowBlur=28; ctx.shadowOffsetY=10;
    rrect(0,0,w,h,RADIUS); ctx.fillStyle='#8B0000'; ctx.fill();
    ctx.restore();
    if (backReady) {
      ctx.save(); rrect(0,0,w,h,RADIUS); ctx.clip();
      ctx.drawImage(osc,0,0); ctx.restore();
    }
  }

  function drawPeeled(peel, anchorX) {
    const w=canvas.width, h=canvas.height;
    ctx.clearRect(0,0,w,h);

    const foldRise  = peel*h*0.84;
    const foldY     = h-foldRise;
    const lean      = (anchorX/w-0.5)*2;
    const leanShift = lean*foldRise*0.28;

    // ── Bottom flat portion ─────────────────────────────────────────────────
    ctx.save();
    ctx.shadowColor=`rgba(0,0,0,${0.35+peel*0.30})`; ctx.shadowBlur=20*peel;
    ctx.shadowOffsetX=lean*5*peel; ctx.shadowOffsetY=10*peel;
    ctx.beginPath();
    ctx.moveTo(0,RADIUS); ctx.arcTo(0,0,RADIUS,0,RADIUS);
    ctx.lineTo(w-RADIUS,0); ctx.arcTo(w,0,w,RADIUS,RADIUS);
    ctx.lineTo(w,foldY+leanShift);
    ctx.bezierCurveTo(w*0.75,foldY+leanShift+10*peel,w*0.25,foldY-leanShift+10*peel,0,foldY-leanShift);
    ctx.closePath(); ctx.fillStyle='#8B0000'; ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0,RADIUS); ctx.arcTo(0,0,RADIUS,0,RADIUS);
    ctx.lineTo(w-RADIUS,0); ctx.arcTo(w,0,w,RADIUS,RADIUS);
    ctx.lineTo(w,foldY+leanShift);
    ctx.bezierCurveTo(w*0.75,foldY+leanShift+10*peel,w*0.25,foldY-leanShift+10*peel,0,foldY-leanShift);
    ctx.closePath(); ctx.clip();
    if (backReady) ctx.drawImage(osc,0,0);
    ctx.restore();

    // ── Curl flap ───────────────────────────────────────────────────────────
    const curlNarrow=peel*w*0.05;
    const curlDepth=foldRise*(0.48+peel*0.38);
    const BLx=curlNarrow*0.5, BLy=foldY-leanShift;
    const BRx=w-curlNarrow*0.5, BRy=foldY+leanShift;
    const TLx=BLx+curlNarrow*0.4+lean*curlDepth*0.12, TLy=BLy-curlDepth;
    const TRx=BRx-curlNarrow*0.4+lean*curlDepth*0.12, TRy=BRy-curlDepth;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(BLx,BLy);
    ctx.bezierCurveTo(w*0.25,BLy+9*peel,w*0.75,BRy+9*peel,BRx,BRy);
    ctx.bezierCurveTo(BRx-4,BRy-curlDepth*0.4,TRx+7,TRy+curlDepth*0.15,TRx,TRy);
    ctx.bezierCurveTo(w*0.68+lean*8,TRy-5*peel,w*0.32+lean*8,TLy-5*peel,TLx,TLy);
    ctx.bezierCurveTo(TLx-7,TLy+curlDepth*0.15,BLx+4,BLy-curlDepth*0.4,BLx,BLy);
    ctx.closePath(); ctx.clip();

    // Flap base color
    const fg=ctx.createLinearGradient(0,BLy,0,TLy);
    fg.addColorStop(0,'#C42020'); fg.addColorStop(0.3,'#A01818'); fg.addColorStop(1,'#6A0000');
    ctx.fillStyle=fg; ctx.fillRect(0,0,w,h);

    // Same baked texture on the flap
    if (backReady) {
      ctx.globalAlpha=0.90-peel*0.18;
      ctx.drawImage(osc,0,0);
      ctx.globalAlpha=1;
    }

    // Fold-edge cream glow
    const eg=ctx.createLinearGradient(0,BLy,0,BLy+24);
    eg.addColorStop(0,`rgba(248,244,238,${peel*0.72})`);
    eg.addColorStop(0.5,`rgba(248,244,238,${peel*0.22})`);
    eg.addColorStop(1,'rgba(248,244,238,0)');
    ctx.fillStyle=eg; ctx.fillRect(0,BLy-2,w,28);

    // Specular sheen
    const sg=ctx.createLinearGradient(0,TLy,0,BLy);
    sg.addColorStop(0,`rgba(255,255,255,${peel*0.22})`);
    sg.addColorStop(0.45,`rgba(255,255,255,${peel*0.07})`);
    sg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=sg; ctx.fillRect(0,TLy,w,BLy-TLy);
    ctx.restore();
  }

  // ═══════════════════════════════════════════════════════════════════════════
  //  INPUT
  // ═══════════════════════════════════════════════════════════════════════════
  const ANCHORS=[
    {xFrac:0.13, dot:document.getElementById('dot-left')},
    {xFrac:0.50, dot:document.getElementById('dot-center')},
    {xFrac:0.87, dot:document.getElementById('dot-right')},
  ];
  const HIT_R=54;
  let activeAnchor=null, activeTouchId=null, peelAmount=0;
  let snapRunning=false, rafId=null, snapRafId=null;

  function getPos(cx,cy){ const r=canvas.getBoundingClientRect(); return {x:cx-r.left,y:cy-r.top}; }

  function findAnchor(x,y){
    if(y<canvas.height*0.64) return null;
    for(const a of ANCHORS){
      const ax=a.xFrac*canvas.width, ay=canvas.height;
      if(Math.sqrt((x-ax)**2+(y-ay)**2)<HIT_R) return a;
    }
    return null;
  }

  function setDot(a){ ANCHORS.forEach(d=>d.dot.classList.toggle('active',d===a)); }

  function startPeel(anchor,clientY){
    cancelSnap(); cancelRaf();
    activeAnchor=anchor; peelAmount=0;
    setDot(anchor); hintEl.classList.add('hidden');
    updatePeel(clientY);
    rafId=requestAnimationFrame(loop);
  }

  function updatePeel(clientY){
    const r=canvas.getBoundingClientRect();
    const up=Math.max(0,canvas.height-(clientY-r.top));
    peelAmount=Math.min(1,up/(canvas.height*0.74));
  }

  function endPeel(){
    if(!activeAnchor) return;
    cancelRaf();
    const ax=activeAnchor.xFrac*canvas.width;
    activeAnchor=null; activeTouchId=null; setDot(null);
    snapBack(ax);
  }

  function loop(){
    if(!activeAnchor) return;
    drawPeeled(peelAmount, activeAnchor.xFrac*canvas.width);
    rafId=requestAnimationFrame(loop);
  }

  function snapBack(ax){
    cancelSnap();
    const sp=peelAmount, t0=performance.now(), dur=210;
    snapRunning=true;
    function step(now){
      const t=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-t,3);
      peelAmount=sp*(1-e);
      drawPeeled(peelAmount,ax);
      if(t<1){ snapRafId=requestAnimationFrame(step); }
      else { snapRunning=false; peelAmount=0; drawFlat(); hintEl.classList.remove('hidden'); }
    }
    snapRafId=requestAnimationFrame(step);
  }

  function cancelRaf() { if(rafId){cancelAnimationFrame(rafId);rafId=null;} }
  function cancelSnap(){ if(snapRafId){cancelAnimationFrame(snapRafId);snapRafId=null;} snapRunning=false; }

  // Touch
  canvas.addEventListener('touchstart',function(e){
    if(activeAnchor) return;
    for(let i=0;i<e.changedTouches.length;i++){
      const t=e.changedTouches[i], p=getPos(t.clientX,t.clientY), f=findAnchor(p.x,p.y);
      if(f){e.preventDefault();activeTouchId=t.identifier;startPeel(f,t.clientY);return;}
    }
  },{passive:false});

  canvas.addEventListener('touchmove',function(e){
    if(!activeAnchor) return;
    for(let i=0;i<e.changedTouches.length;i++){
      const t=e.changedTouches[i];
      if(t.identifier===activeTouchId){e.preventDefault();updatePeel(t.clientY);return;}
    }
  },{passive:false});

  function onTouchEnd(e){
    for(let i=0;i<e.changedTouches.length;i++){
      if(e.changedTouches[i].identifier===activeTouchId){endPeel();return;}
    }
  }
  canvas.addEventListener('touchend',   onTouchEnd,{passive:false});
  canvas.addEventListener('touchcancel',onTouchEnd,{passive:false});

  // Mouse fallback
  let mheld=false;
  canvas.addEventListener('mousedown',function(e){
    const p=getPos(e.clientX,e.clientY),f=findAnchor(p.x,p.y);
    if(!f) return; mheld=true; startPeel(f,e.clientY);
  });
  window.addEventListener('mousemove',function(e){ if(!mheld||!activeAnchor) return; updatePeel(e.clientY); });
  window.addEventListener('mouseup',  function(){ if(!mheld) return; mheld=false; endPeel(); });

  // Init
  window.addEventListener('resize', resize);
  resize();

}); // end load
</script>
</body>
</html>
