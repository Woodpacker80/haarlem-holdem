<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haarlem Hold'em — TV (Host)</title>
<style>
  html,body{margin:0;padding:0;min-height:100%;overflow-y:auto;background:#0F2A55;color:#e9e2cf;
    font-family:'Montserrat',-apple-system,sans-serif;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;gap:12px;padding:18px 24px 40px;}
  h1{font-size:18px;letter-spacing:.08em;color:#c9a84c;text-transform:uppercase;margin:0;}
  .sub{font-size:12px;color:#7d8299;text-align:center;max-width:500px;line-height:1.5;margin:0;}
  label{font-size:12px;color:#7d8299;margin-right:6px;}
  input[type=number]{width:64px;background:#0d1626;border:1px solid #3a3f52;color:#e9e2cf;
    border-radius:6px;padding:6px;font-size:13px;margin-right:14px;}
  button{background:transparent;border:2px solid #c9a84c;color:#c9a84c;padding:12px 22px;
    border-radius:8px;font-size:14px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;}
  button:hover{background:rgba(201,168,76,0.15);}
  button:disabled{opacity:0.3;cursor:default;}
  #conn{font-size:11px;letter-spacing:.05em;text-transform:uppercase;}
  #conn.bad{color:#BE1622;} #conn.good{color:#3fbf6f;}
  #jumbo{width:80vw;max-width:900px;border:2px solid #c9a84c;border-radius:16px;
    background:radial-gradient(ellipse at center, #23433a 0%, #182e27 70%, #12211c 100%);padding:16px;}
  table{border-collapse:collapse;font-size:13px;width:100%;}
  th,td{text-align:left;padding:5px 10px;border-bottom:1px solid #1c2338;}
  th{color:#7d8299;font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.04em;}
  tr.acting{color:#c9a84c;font-weight:700;}
  tr.folded{color:#3a3f52;text-decoration:line-through;}
  .tag{display:inline-block;font-size:10px;border:1px solid #c9a84c;color:#c9a84c;border-radius:3px;
    padding:0 5px;margin-left:5px;}
  .card{display:inline-block;background:#f5f1e6;color:#1a1a1a;border-radius:6px;
    padding:5px 9px;margin:2px;font-weight:700;font-size:18px;min-width:34px;text-align:center;}
  .card.red{color:#BE1622;}
  .burnCard{display:inline-block;background:#BE1622;border:1.5px solid #c9a84c;border-radius:6px;
    padding:5px 9px;margin:2px;min-width:34px;height:26px;text-align:center;
    animation:burnPulse 1.1s ease-in-out infinite;}
  @keyframes burnPulse{0%,100%{opacity:0.65;}50%{opacity:1;}}
  #boardArea{text-align:center;margin-bottom:16px;min-height:50px;}
  #statusLine{font-size:15px;color:#c9a84c;text-align:center;margin-bottom:14px;}
  .potbox{border:1px solid #3a3f52;border-radius:8px;padding:10px 16px;margin-bottom:8px;}
  .potbox .amount{color:#c9a84c;font-weight:700;font-size:15px;}
  .potbox .eligible{font-size:12px;color:#7d8299;}
  #setupArea{text-align:center;}
  #seatList{font-size:13px;color:#7d8299;margin:10px 0;}
</style>
</head>
<body>
<h1>Haarlem Hold'em — TV / Host</h1>
<p class="sub">This screen runs the game and shares it with every phone in the room. Keep this
open for the whole session.</p>
<div id="conn">connecting…</div>
<button id="quitGameBtn" style="padding:8px 16px;font-size:12px;">Quit Game</button>
<button id="clearBansBtn" style="padding:8px 16px;font-size:12px;">Clear All Bans</button>
<button id="startNewGameBtn" style="padding:8px 16px;font-size:12px;">Start New Game</button>
<div id="tvError" style="color:#BE1622;font-size:12px;min-height:16px;"></div>

<div id="setupArea">
  <div id="seatList">Waiting for players to join…</div>
  <label>Starting stack</label><input type="number" id="startStack" value="200" min="20">
  <label>Small blind</label><input type="number" id="sbAmount" value="5" min="1">
  <label>Big blind</label><input type="number" id="bbAmount" value="10" min="2">
  <div style="margin-top:12px;"><button id="startBtn" disabled>Start Game</button></div>
</div>

<div id="jumbo" style="display:none;">
  <div id="statusLine"></div>
  <div id="boardArea"></div>
  <table id="seatTable"></table>
  <div id="resultArea"></div>
  <div id="hostControls" style="text-align:center;margin-top:14px;"></div>
</div>

<script type="module">
import { ensureAuth, watchConnection } from './firebase-config.js';
import { watchSeats, writePublicState, watchPublicState, writeHoleCards, watchActionQueue, clearActionQueueItem, clearGameState, kickSeat, clearBans } from './game-sync.js';
import { startHand, applyHandAction } from './full-hand.js';

const connEl = document.getElementById('conn');
watchConnection((connected) => {
  connEl.textContent = connected ? 'connected' : 'disconnected';
  connEl.className = connected ? 'good' : 'bad';
});

function renderCard(card) {
  const isRed = card.suit === '♥' || card.suit === '♦';
  return `<span class="card${isRed ? ' red' : ''}">${card.rank}${card.suit}</span>`;
}

// The TV keeps the authoritative in-memory game state. Only the PUBLIC
// parts (no hole cards) get written to Firebase for phones to read.
let handState = null;
let gameConfig = null; // { dealerSeat, stacks, activeSeats, smallBlindAmount, bigBlindAmount }
let currentSeats = {}; // seatIndex -> uid, from watchSeats

// For the burn-card tension effect: how many board cards have actually been
// SHOWN so far (which can lag behind handState.board.length while a burn
// animation is playing). Reset whenever a new hand starts.
let revealedBoardLen = 0;
let burnAnimationPending = false;

function publicStateFrom(h) {
  return {
    numSeats: h.numSeats,
    dealerSeat: h.dealerSeat,
    activeSeats: h.activeSeats,
    street: h.street,
    board: h.board,
    foldedSeats: h.foldedSeats,
    stacks: h.stacks,
    bets: h.bettingRound ? h.bettingRound.bets : {},
    actingSeat: h.bettingRound ? h.bettingRound.actingSeat : null,
    currentBet: h.bettingRound ? h.bettingRound.currentBet : 0,
    minRaiseAmount: h.bettingRound ? h.bettingRound.minRaiseAmount : 0,
    result: h.result, // includes ranking with categoryName — safe to reveal, showdown is public in real poker too
    revealedHoleCards: h.result && !h.result.uncontested ? h.holeCards : null, // reveal at real showdown only
  };
}

function publish() {
  try {
    writePublicState(publicStateFrom(handState));
    render();
    document.getElementById('tvError').textContent = '';
  } catch (e) {
    document.getElementById('tvError').textContent = '⚠ publish crashed: ' + e.message;
    console.error(e);
  }
}

function dealFirstHand() {
  const activeSeats = Object.keys(currentSeats).map(Number).sort((a, b) => a - b);
  const startStack = parseInt(document.getElementById('startStack').value, 10);
  const stacks = {};
  activeSeats.forEach(s => stacks[s] = startStack);
  gameConfig = {
    activeSeats,
    stacks,
    dealerSeat: activeSeats[0],
    smallBlindAmount: parseInt(document.getElementById('sbAmount').value, 10),
    bigBlindAmount: parseInt(document.getElementById('bbAmount').value, 10),
  };
  startNewHand();
  document.getElementById('setupArea').style.display = 'none';
  document.getElementById('jumbo').style.display = 'block';
}

function startNewHand() {
  revealedBoardLen = 0;
  burnAnimationPending = false;
  handState = startHand({
    numSeats: Math.max(...gameConfig.activeSeats) + 1,
    activeSeats: gameConfig.activeSeats,
    stacks: gameConfig.stacks,
    dealerSeat: gameConfig.dealerSeat,
    smallBlindAmount: gameConfig.smallBlindAmount,
    bigBlindAmount: gameConfig.bigBlindAmount,
  });
  writeHoleCards(handState.holeCards);
  publish();
}

function dealNextHand() {
  gameConfig.stacks = handState.stacks;
  gameConfig.activeSeats = gameConfig.activeSeats.filter(s => gameConfig.stacks[s] > 0);
  if (gameConfig.activeSeats.length < 2) {
    document.getElementById('resultArea').innerHTML = '<div style="color:#c9a84c;">Game over — not enough players with chips left.</div>';
    return;
  }
  // Advance dealer button to the next active seat.
  const numSeats = handState.numSeats;
  let next = (gameConfig.dealerSeat + 1) % numSeats;
  while (!gameConfig.activeSeats.includes(next)) next = (next + 1) % numSeats;
  gameConfig.dealerSeat = next;
  startNewHand();
}

// Process action requests from phones, strictly in arrival order.
watchActionQueue((key, request) => {
  clearActionQueueItem(key); // remove immediately so it's never reprocessed
  if (!handState || handState.result) return; // no hand in progress — ignore stray requests
  try {
    handState = applyHandAction(handState, request.seat, request.action);
    publish();
    document.getElementById('tvError').textContent = '';
  } catch (e) {
    document.getElementById('tvError').textContent = '⚠ Rejected action from Seat ' + (request.seat + 1) + ': ' + e.message;
    console.error('Rejected action from seat', request.seat, ':', e.message);
  }
});

watchSeats((seats) => {
  currentSeats = seats;
  const count = Object.keys(seats).length;
  const seatListEl = document.getElementById('seatList');
  if (count === 0) {
    seatListEl.textContent = 'Waiting for players to join…';
  } else {
    seatListEl.innerHTML = Object.entries(seats)
      .sort((a, b) => Number(a[0]) - Number(b[0]))
      .map(([seatStr, uid]) => `
        <span style="display:inline-flex;align-items:center;gap:6px;margin:0 10px;">
          Seat ${Number(seatStr) + 1}
          <button class="kickBtn" data-seat="${seatStr}" data-uid="${uid}"
            style="font-size:11px;padding:3px 8px;">Kick</button>
        </span>`).join('');
    seatListEl.querySelectorAll('.kickBtn').forEach((btn) => {
      btn.addEventListener('click', () => {
        kickSeat(btn.dataset.uid, Number(btn.dataset.seat));
      });
    });
  }
  document.getElementById('startBtn').disabled = count < 2 || handState !== null;
});

document.getElementById('startBtn').addEventListener('click', dealFirstHand);

// Lets the host manually reset whenever things get stuck. Deliberately a
// 1. QUIT GAME — plain stop. Clears seats, hole cards, public state, and
// any queued actions, so nothing stale (like old hole cards) can linger.
// Deliberately does NOT touch bans and does NOT kick anyone — a currently
// connected phone's own auto-rejoin listener may grab a seat right back,
// and that's fine here: cleaning THAT up is what step 3 is for.
document.getElementById('quitGameBtn').addEventListener('click', async () => {
  handState = null;
  gameConfig = null;
  await clearGameState();
  document.getElementById('jumbo').style.display = 'none';
  document.getElementById('setupArea').style.display = 'block';
  document.getElementById('seatList').innerHTML = 'Waiting for players to join…';
  document.getElementById('startBtn').disabled = true;
});

// 2. CLEAR ALL BANS — lifts every kick from the previous game, manually,
// whenever the host chooses. See kickSeat/clearBans in game-sync.js.
document.getElementById('clearBansBtn').addEventListener('click', clearBans);

// 3. START NEW GAME — the actual "make sure the room is really empty"
// step. Bans + removes whoever is seated AT THIS EXACT MOMENT (which may
// include a ghost that silently auto-rejoined right after Quit Game,
// since nothing stopped it from doing that) — this defeats that phone's
// own auto-rejoin listener (it checks the ban before reclaiming). Doing
// this as its own step, AFTER Clear All Bans has already run, means we
// don't need any auto-expiring/timed unban logic: whatever gets banned
// here just sits banned until the host clicks Clear All Bans again next
// time, which is exactly the explicit, host-controlled behavior wanted.
document.getElementById('startNewGameBtn').addEventListener('click', async () => {
  await Promise.all(Object.entries(currentSeats).map(([seatStr, uid]) => kickSeat(uid, Number(seatStr))));
  document.getElementById('jumbo').style.display = 'none';
  document.getElementById('setupArea').style.display = 'block';
  document.getElementById('seatList').innerHTML = 'Waiting for players to join…';
  document.getElementById('startBtn').disabled = true;
});

// Burn-card tension effect: whenever the board has grown beyond what's
// currently shown, hold on a face-down "burn" card for a beat, then reveal
// ONE street's worth of cards, then (if more still need showing — this is
// what happens during an all-in runout, where the engine deals flop+turn+
// river in a single internal jump) pause briefly and repeat. Purely
// presentational: the engine already burns a real card internally either
// way (deck.js) — this just stops hiding the ritual from the players, and
// stops an all-in runout from dumping all 5 board cards on screen at once.
function revealNextStep() {
  const h = handState;
  if (!h) { burnAnimationPending = false; return; }
  const actualBoardLen = h.board.length;
  if (revealedBoardLen >= actualBoardLen) { burnAnimationPending = false; return; }
  burnAnimationPending = true;
  const alreadyShown = h.board.slice(0, revealedBoardLen).map(renderCard).join('');
  document.getElementById('boardArea').innerHTML = alreadyShown + '<span class="burnCard"></span>';
  // First reveal is the flop (3 cards at once); every reveal after that is
  // exactly one card (turn, then river) — matches real street sizes.
  const stepTarget = revealedBoardLen === 0 ? Math.min(3, actualBoardLen) : Math.min(revealedBoardLen + 1, actualBoardLen);
  setTimeout(() => {
    revealedBoardLen = stepTarget;
    document.getElementById('boardArea').innerHTML = h.board.slice(0, revealedBoardLen).map(renderCard).join('');
    if (revealedBoardLen < actualBoardLen) {
      setTimeout(revealNextStep, 550); // brief beat before burning the next one
    } else {
      burnAnimationPending = false;
      render(); // catch up anything (like the result box) that was waiting on this
    }
  }, 1100);
}

function render() {
  if (!handState) return;
  const h = handState;
  document.getElementById('statusLine').textContent =
    h.result ? 'Hand complete' : `Street: ${h.street} — Seat ${h.bettingRound ? h.bettingRound.actingSeat + 1 : '—'} to act`;

  const actualBoardLen = h.board.length;
  if (actualBoardLen > revealedBoardLen && !burnAnimationPending) {
    revealNextStep();
  } else if (!burnAnimationPending) {
    document.getElementById('boardArea').innerHTML = h.board.slice(0, revealedBoardLen).map(renderCard).join('') || '<span style="color:#7d8299;">(pre-flop)</span>';
  }
  const revealCaughtUp = revealedBoardLen >= actualBoardLen && !burnAnimationPending;

  const rows = h.activeSeats.map(seat => {
    const folded = h.foldedSeats.includes(seat);
    const isActing = h.bettingRound && h.bettingRound.actingSeat === seat;
    const bet = h.bettingRound ? (h.bettingRound.bets[seat] || 0) : 0;
    const cls = folded ? 'folded' : (isActing ? 'acting' : '');
    const dealerTag = seat === h.dealerSeat ? '<span class="tag">D</span>' : '';
    const revealed = h.result && !h.result.uncontested && revealCaughtUp ? h.holeCards[seat] : null;
    return `<tr class="${cls}">
      <td>Seat ${seat + 1}${dealerTag}</td>
      <td>${revealed ? revealed.map(renderCard).join('') : '🂠 🂠'}</td>
      <td>${h.stacks[seat]}</td>
      <td>${bet}</td>
      <td>${folded ? 'folded' : (h.stacks[seat] === 0 ? 'all-in' : '')}</td>
    </tr>`;
  }).join('');
  document.getElementById('seatTable').innerHTML =
    `<tr><th>Seat</th><th>Cards</th><th>Stack</th><th>Bet</th><th>Status</th></tr>${rows}`;

  const resultArea = document.getElementById('resultArea');
  const hostControls = document.getElementById('hostControls');
  if (h.result && revealCaughtUp) {
    const potsHtml = h.result.pots.map((p, i) => `
      <div class="potbox">
        <div class="amount">${i === 0 ? 'Main Pot' : 'Side Pot ' + i}: ${p.amount}</div>
        <div class="eligible">Won by: ${Object.entries(h.result.payouts).filter(([,a])=>a>0).map(([s,a])=>'Seat '+(Number(s)+1)+' ('+a+')').join(', ')}</div>
      </div>`).join('');
    resultArea.innerHTML = potsHtml;
    hostControls.innerHTML = `<button id="nextHandBtn">Deal Next Hand</button>`;
    document.getElementById('nextHandBtn').addEventListener('click', dealNextHand);
  } else {
    resultArea.innerHTML = '';
    hostControls.innerHTML = '';
  }
}

ensureAuth();
</script>
</body>
</html>
