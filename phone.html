<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haarlem Hold'em — Phone</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0F2A55;color:#e9e2cf;
    font-family:'Montserrat',-apple-system,sans-serif;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;gap:16px;padding:20px;}
  h1{font-size:14px;letter-spacing:.06em;color:#c9a84c;text-transform:uppercase;margin:0;}
  .sub{font-size:11px;color:#7d8299;text-align:center;max-width:320px;line-height:1.5;margin:0;}
  #conn{font-size:10px;letter-spacing:.05em;text-transform:uppercase;}
  #conn.bad{color:#BE1622;} #conn.good{color:#3fbf6f;}
  #seatBadge{font-size:13px;color:#c9a84c;}
  #board{text-align:center;min-height:44px;}
  .card{display:inline-block;background:#f5f1e6;color:#1a1a1a;border-radius:6px;
    padding:5px 9px;margin:2px;font-weight:700;font-size:16px;min-width:32px;text-align:center;}
  .card.red{color:#BE1622;}
  #myHand{text-align:center;}
  #myHand .card{font-size:22px;padding:8px 12px;}
  #info{font-size:13px;color:#7d8299;text-align:center;}
  #actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;}
  button{background:transparent;border:2px solid #c9a84c;color:#c9a84c;padding:12px 18px;
    border-radius:8px;font-size:14px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;}
  button:hover{background:rgba(201,168,76,0.15);}
  button.fold{border-color:#BE1622;color:#BE1622;}
  button.fold:hover{background:rgba(190,22,34,0.15);}
  #others{font-size:11px;color:#7d8299;text-align:center;line-height:1.7;}
  #others .folded{text-decoration:line-through;color:#3a3f52;}
  #others .acting{color:#c9a84c;font-weight:700;}
  #resultBox{text-align:center;font-size:13px;color:#c9a84c;max-width:320px;}
  #error{color:#BE1622;font-size:11px;min-height:14px;}
  #gameArea{width:100%;max-width:340px;border:1.5px solid #c9a84c;border-radius:14px;
    background:radial-gradient(ellipse at center, #23433a 0%, #182e27 70%, #12211c 100%);
    padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px;}
</style>
</head>
<body>
<h1>Phone — Player</h1>
<div id="conn">connecting…</div>
<div id="seatBadge">joining…</div>
<div id="error"></div>

<div id="gameArea">
<div id="board"></div>
<div id="info"></div>
<div id="myHand"></div>
<div id="actions"></div>
<div id="others"></div>
<div id="resultBox"></div>
</div>
<div id="debug" style="font-size:9px;color:#3a3f52;max-width:340px;word-break:break-all;margin-top:20px;"></div>

<script type="module">
import { ensureAuth, watchConnection } from './firebase-config.js';
import { claimSeat, watchSeats, watchPublicState, watchOwnHoleCards, requestAction, releaseStaleLocalSeat, rememberLocalSeat } from './game-sync.js';
import { getLegalActions } from './betting-round.js';

const connEl = document.getElementById('conn');
let myUid = null;
let mySeat = null;
let latestPublicState = null;
let wasDisconnected = false;

let unsubscribeHoleCards = null;

// Single place that "becomes" a given seat: updates mySeat, the on-screen
// badge, and — importantly — re-subscribes the hole-cards listener to the
// correct path. Without this, if a rejoin ever landed on a DIFFERENT seat
// number than before, the old listener would keep watching the wrong path
// forever (Firebase doesn't automatically move a subscription just because
// a JS variable changed).
function adoptSeat(seat) {
  mySeat = seat;
  rememberLocalSeat(myUid, seat);
  document.getElementById('seatBadge').textContent = `You are Seat ${mySeat + 1}`;
  if (unsubscribeHoleCards) unsubscribeHoleCards();
  unsubscribeHoleCards = watchOwnHoleCards(mySeat, (cards) => {
    document.getElementById('myHand').innerHTML = cards ? cards.map(renderCard).join('') : '<span style="color:#7d8299;font-size:12px;">waiting for the deal…</span>';
  });
}

watchConnection((connected) => {
  connEl.textContent = connected ? 'connected' : 'disconnected';
  connEl.className = connected ? 'good' : 'bad';

  // BUG FIX: a brief disconnect (screen lock, backgrounded tab, wifi blip —
  // all common on a phone) triggers the onDisconnect cleanup that frees
  // this seat in Firebase, so the TV correctly stops seeing this player as
  // joined. But this phone's own `mySeat` variable never noticed — it kept
  // showing whatever it last received, looking "stuck" on an old hand,
  // with no way to rejoin except manually reloading the page. Re-claiming
  // the seat the moment a REAL disconnect->reconnect happens (tracked
  // directly, rather than guessing from a "first load" flag that could
  // race against ensureAuth() still being in flight) closes that gap.
  if (!connected) {
    wasDisconnected = true;
  } else if (wasDisconnected && myUid) {
    wasDisconnected = false;
    claimSeat(myUid).then((seat) => { if (seat !== null) adoptSeat(seat); });
  }
});

function renderCard(card) {
  const isRed = card.suit === '♥' || card.suit === '♦';
  return `<span class="card${isRed ? ' red' : ''}">${card.rank}${card.suit}</span>`;
}

(async () => {
  myUid = await ensureAuth();
  await releaseStaleLocalSeat(myUid);
  const seat = await claimSeat(myUid);
  if (seat === null) {
    document.getElementById('seatBadge').textContent = 'Room is full — could not join.';
    return;
  }
  adoptSeat(seat);

  // Covers a DIFFERENT case than the reconnect handling above: the host
  // clicking "New Game / Reset" clears seats directly, with no network
  // disconnect involved at all, so the reconnect-based re-claim never
  // fires. Watching seats directly and noticing "my seat's gone" catches
  // this too, so a host reset doesn't leave phones stuck needing a manual
  // reload.
  watchSeats((seats) => {
    if (myUid && seats[mySeat] !== myUid) {
      claimSeat(myUid).then((seat) => {
        if (seat !== null) adoptSeat(seat);
        else document.getElementById('seatBadge').textContent = 'Room is full — could not rejoin.';
      });
    }
  });

  watchPublicState((state) => {
    latestPublicState = state;
    document.getElementById('debug').textContent = 'mySeat=' + mySeat + ' | raw state: ' + JSON.stringify(state);
    try {
      render(state);
    } catch (e) {
      document.getElementById('error').textContent = '⚠ render crashed: ' + e.message;
      console.error(e);
    }
  });
})();

function render(state) {
  const errorEl = document.getElementById('error');
  if (!state) {
    document.getElementById('info').textContent = 'Waiting for the host to start the game…';
    document.getElementById('actions').innerHTML = '';
    document.getElementById('board').innerHTML = '';
    document.getElementById('others').innerHTML = '';
    return;
  }
  // BUG FIX: Firebase Realtime Database silently drops any field written as
  // an empty array (or empty object) — it treats [] as "no data" rather
  // than "an empty list". board and foldedSeats both start out empty
  // (before the flop, and before anyone folds), so they were routinely
  // missing from what actually arrives here, crashing every `.map()` /
  // `.includes()` call below. Normalizing once here means every usage
  // after this point can safely assume a real array exists.
  state = { ...state, board: state.board || [], foldedSeats: state.foldedSeats || [] };

  document.getElementById('board').innerHTML = state.board.map(renderCard).join('') || '<span style="color:#7d8299;font-size:12px;">pre-flop</span>';

  const myStack = state.stacks[mySeat];
  const myBet = state.bets[mySeat] || 0;
  document.getElementById('info').textContent = state.result
    ? 'Hand complete — waiting for the next hand'
    : `Your stack: ${myStack}   Your bet: ${myBet}   Current bet: ${state.currentBet}`;

  // Other seats, status only (no cards unless it's a real showdown reveal).
  const others = state.activeSeats.filter(s => s !== mySeat).map(seat => {
    const folded = state.foldedSeats.includes(seat);
    const acting = state.actingSeat === seat;
    const cls = folded ? 'folded' : (acting ? 'acting' : '');
    const revealedCards = state.revealedHoleCards && state.revealedHoleCards[seat]
      ? ' ' + state.revealedHoleCards[seat].map(renderCard).join('') : '';
    return `<div class="${cls}">Seat ${seat + 1}: ${state.stacks[seat]} chips${revealedCards}</div>`;
  }).join('');
  document.getElementById('others').innerHTML = others;

  // Action buttons — only when it's genuinely my turn, computed the same
  // way the host will validate it (getLegalActions is a pure function, so
  // running it here just predicts what the host will accept).
  const actionsEl = document.getElementById('actions');
  if (!state.result && state.actingSeat === mySeat) {
    const fakeBettingRoundState = {
      actingSeat: state.actingSeat, activeSeats: state.activeSeats, folded: state.foldedSeats,
      allIn: state.activeSeats.filter(s => state.stacks[s] === 0 && !state.foldedSeats.includes(s)),
      bets: state.bets, stacks: state.stacks, currentBet: state.currentBet, minRaiseAmount: state.minRaiseAmount,
    };
    const { legal, toCall, minRaiseTotal, maxRaiseTotal } = getLegalActions(fakeBettingRoundState, mySeat);
    actionsEl.innerHTML = legal.map(type => {
      if (type === 'raise') {
        return `<button data-type="raise" data-amount="${minRaiseTotal}">Raise to ${minRaiseTotal}</button>
                <button data-type="raise" data-amount="${maxRaiseTotal}">All-in (${maxRaiseTotal})</button>`;
      }
      const label = type === 'call' ? `Call ${toCall}` : type[0].toUpperCase() + type.slice(1);
      return `<button data-type="${type}"${type === 'fold' ? ' class="fold"' : ''}>${label}</button>`;
    }).join('');
    actionsEl.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.dataset.type;
        const action = type === 'raise' ? { type, amount: Number(btn.dataset.amount) } : { type };
        requestAction(mySeat, action);
        errorEl.textContent = '';
        actionsEl.innerHTML = ''; // avoid double-taps while waiting for the host to process
      });
    });
  } else {
    actionsEl.innerHTML = '';
  }

  document.getElementById('resultBox').textContent = state.result
    ? (state.result.uncontested
        ? `Seat ${Object.entries(state.result.payouts).find(([,a]) => a > 0)[0] * 1 + 1} wins uncontested.`
        : 'Showdown — see the TV for full results.')
    : '';
}
</script>
</body>
</html>
