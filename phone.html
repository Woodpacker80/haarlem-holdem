<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haarlem Hold'em — Phone</title>
<script src="sfx.js"></script>
<script src="card-art.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0F2A55;color:#e9e2cf;
    font-family:'Montserrat',-apple-system,sans-serif;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;gap:16px;padding:20px;}
  h1{font-size:14px;letter-spacing:.06em;color:#c9a84c;text-transform:uppercase;margin:0;}
  .sub{font-size:11px;color:#7d8299;text-align:center;max-width:320px;line-height:1.5;margin:0;}
  #conn{font-size:10px;letter-spacing:.05em;text-transform:uppercase;}
  #conn.bad{color:#BE1622;} #conn.good{color:#3fbf6f;}
  #seatBadge{font-size:13px;color:#c9a84c;}
  #board{text-align:center;min-height:44px;}
  .card{display:inline-block;background:#f5f1e6;color:#1a1a1a;border-radius:6px;
    padding:5px 9px;margin:2px;font-weight:700;font-size:16px;min-width:32px;text-align:center;}
  .card.red{color:#BE1622;}
  #squeezeContainer{position:relative;width:300px;height:260px;margin:0 auto;
    border-radius:10px;overflow:hidden;background:#182e27;touch-action:none;
    border:1px solid rgba(201,168,76,0.35);}
  #squeezeContainer canvas{display:block;touch-action:none;}
  #squeezeHorizonLine{position:absolute;left:0;right:0;top:32%;height:1.5px;
    background:#c9a84c;
    pointer-events:none;z-index:5;}
  #squeezeStackReadout{position:absolute;left:0;right:0;top:0;height:32%;
    display:flex;align-items:center;justify-content:center;
    color:#c9a84c;font-size:19px;letter-spacing:.03em;font-weight:600;
    pointer-events:none;z-index:5;text-align:center;padding:0 10px;}
  #info{font-size:13px;color:#7d8299;text-align:center;}
  #actions{width:100%;display:flex;flex-direction:column;gap:26px;}
  #actionsTop{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;}
  #actionsFoldRow{display:flex;justify-content:space-between;align-items:center;}
  button{background:transparent;border:2px solid #c9a84c;color:#c9a84c;padding:12px 18px;
    border-radius:8px;font-size:14px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;}
  button:hover{background:rgba(201,168,76,0.15);}
  button.fold{border-color:#BE1622;color:#BE1622;}
  button.fold:hover{background:rgba(190,22,34,0.15);}
  #others{font-size:11px;color:#7d8299;text-align:center;line-height:1.7;}
  #others .folded{text-decoration:line-through;color:#3a3f52;}
  #others .acting{color:#c9a84c;font-weight:700;}
  #resultBox{text-align:center;font-size:13px;color:#c9a84c;max-width:320px;}
  #error{color:#BE1622;font-size:11px;min-height:14px;}
  #gameArea{width:100%;max-width:340px;border:1.5px solid #c9a84c;border-radius:14px;
    background:radial-gradient(ellipse at center, #23433a 0%, #182e27 70%, #12211c 100%);
    padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
</style>
</head>
<body>
<h1>Phone — Player</h1>
<div id="conn">connecting…</div>
<div id="seatBadge">joining…</div>
<div id="error"></div>

<div id="nameGate" style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:20px;">
  <div style="color:#c9a84c;font-size:14px;">What's your name?</div>
  <input id="nameInput" type="text" maxlength="8" placeholder="Name"
    style="font-size:16px;padding:10px 14px;border-radius:8px;border:1px solid #c9a84c;
    background:#0d1626;color:#e9e2cf;width:180px;text-align:center;">
  <button id="joinBtn" type="button">Join Table</button>
</div>

<div id="gameArea" style="display:none;">
<div id="board"></div>
<div id="info"></div>
<div id="myHand" style="text-align:center;">
  <div id="squeezeContainer"><div id="squeezeHorizonLine"></div><div id="squeezeStackReadout"></div></div>
  <div id="handHint" style="color:#7d8299;font-size:12px;margin-top:6px;">waiting for the deal…</div>
</div>
<div id="actions"></div>
<div id="others"></div>
<div id="resultBox"></div>
</div>
<div id="debug" style="font-size:9px;color:#3a3f52;max-width:340px;word-break:break-all;margin-top:20px;"></div>

<script type="module">
import { ensureAuth, watchConnection } from './firebase-config.js';
import { claimSeat, watchSeats, watchPublicState, watchOwnHoleCards, requestAction, releaseStaleLocalSeat, rememberLocalSeat, claimName } from './game-sync.js';
import { getLegalActions } from './betting-round.js';

const connEl = document.getElementById('conn');
let myUid = null;
let mySeat = null;
let latestPublicState = null;
let wasDisconnected = false;
// Remembered ONLY in this tab's live JS memory, never in localStorage or
// anywhere persistent — cleared the instant the tab actually closes or
// reloads. Lets a brief app-switch-and-back silently resume with the same
// name (no realistic disconnect happened), while a genuine fresh session
// still gets asked for a name every time, as intended.
let currentName = null;

let unsubscribeHoleCards = null;

// Squeeze mechanic (ported from squeeze-mechanic-V7_2.html, fully replaces the
// earlier Hold-to-Peek button): a small self-contained Three.js scene showing
// your two hole cards face-down on felt. Dragging upward on them curls the
// near corner back — exactly like squeezing real cardstock to peek at the
// index — and releasing lets them snap back flat. Real dealt rank/suit is
// painted onto each card's face texture the moment cards arrive; before that
// they render as blank-faced backs (no data to show yet).
//
// Camera/curl math and the four-corner index-stamping approach are ported
// unchanged from the demo (already fixed there: viewport meta tag +
// devicePixelRatio, confirmed on a real phone to have no more thumb-blocking
// or corner-clipping). The only real change is that "window" framing became
// "container" framing, since this lives inline in the page instead of taking
// over the whole screen, and textures are generated from real cards instead
// of a fixed demo Ace/2.
const squeezeContainer = document.getElementById('squeezeContainer');
const sqScene = new THREE.Scene();
sqScene.background = new THREE.Color(0x182e27);
sqScene.fog = new THREE.Fog(0x12211c, 4, 100);
const sqCamera = new THREE.PerspectiveCamera(60, 1, 0.05, 50);
const sqCalibratedPos = new THREE.Vector3(-1.87, 0.69, 3.67);
const sqCalibratedLookAt = new THREE.Vector3(-0.32, -0.15, -0.52);
const sqViewDir = sqCalibratedPos.clone().sub(sqCalibratedLookAt).normalize();
const sqWorldUp = new THREE.Vector3(0, 1, 0);
const sqCamRight = new THREE.Vector3().crossVectors(sqViewDir, sqWorldUp).normalize();
const sqCamUp = new THREE.Vector3().crossVectors(sqCamRight, sqViewDir).normalize();
const SQ_NUDGE_X = -0.12;
const SQ_FRAME_MIN = new THREE.Vector3(-0.909 + SQ_NUDGE_X, -0.01, -0.962);
const SQ_FRAME_MAX = new THREE.Vector3(0.809, 0.33, 1.222);
const sqInitialTarget = new THREE.Vector3(-0.05, 0.16, 0.13);
let sqHalfW = 0, sqHalfH = 0;
for (const cx of [SQ_FRAME_MIN.x, SQ_FRAME_MAX.x]) {
  for (const cy of [SQ_FRAME_MIN.y, SQ_FRAME_MAX.y]) {
    for (const cz of [SQ_FRAME_MIN.z, SQ_FRAME_MAX.z]) {
      const v = new THREE.Vector3(cx, cy, cz).sub(sqInitialTarget);
      sqHalfW = Math.max(sqHalfW, Math.abs(v.dot(sqCamRight)));
      sqHalfH = Math.max(sqHalfH, Math.abs(v.dot(sqCamUp)));
    }
  }
}
const SQ_FRAME_SAFETY = 1.18; // was 1.04 — a bit more margin so the cards read as "a nudge smaller"
const SQ_VERTICAL_NUDGE = 0.12; // world units along camera-up; shifts the framed content upward on screen
function updateSqCameraFraming() {
  const w = squeezeContainer.clientWidth, h = squeezeContainer.clientHeight;
  const aspect = w / h;
  sqCamera.aspect = aspect;
  const vFovHalf = THREE.MathUtils.degToRad(sqCamera.fov) / 2;
  const hFovHalf = Math.atan(Math.tan(vFovHalf) * aspect);
  const distance = Math.max(sqHalfH / Math.tan(vFovHalf), sqHalfW / Math.tan(hFovHalf)) * SQ_FRAME_SAFETY;
  sqCamera.position.copy(sqInitialTarget).add(sqViewDir.clone().multiplyScalar(distance));
  sqCamera.position.addScaledVector(sqCamUp, -SQ_VERTICAL_NUDGE); // pan camera down => content appears higher
  sqCamera.updateProjectionMatrix();
  sqCamera.lookAt(sqInitialTarget.clone().addScaledVector(sqCamUp, -SQ_VERTICAL_NUDGE));
}
const sqRenderer = new THREE.WebGLRenderer({ antialias: true });
sqRenderer.setPixelRatio(window.devicePixelRatio || 1);
squeezeContainer.appendChild(sqRenderer.domElement);
function resizeSqRenderer() {
  sqRenderer.setSize(squeezeContainer.clientWidth, squeezeContainer.clientHeight);
  updateSqCameraFraming();
}
sqScene.add(new THREE.AmbientLight(0x404860, 0.75));
const sqKey = new THREE.DirectionalLight(0xfff2d6, 1.0);
sqKey.position.set(1.6, 3.2, -1.6);
sqScene.add(sqKey);
const sqRim = new THREE.PointLight(0xc9a84c, 0.55, 12);
sqRim.position.set(0, 1.2, -3.0);
sqScene.add(sqRim);
const sqTable = new THREE.Mesh(
  new THREE.PlaneGeometry(24, 24),
  new THREE.MeshStandardMaterial({ color: 0x12211c, roughness: 0.95 })
);
sqTable.rotation.x = -Math.PI / 2;
sqScene.add(sqTable);

function sqMakeTexture(draw, size = 512) {
  const cnv = document.createElement('canvas');
  cnv.width = cnv.height = size;
  draw(cnv.getContext('2d'), size);
  const tex = new THREE.CanvasTexture(cnv);
  tex.flipY = false;
  tex.needsUpdate = true;
  return tex;
}
const sqBackTexture = sqMakeTexture((ctx, size) => {
  ctx.fillStyle = '#BE1622';
  ctx.fillRect(0, 0, size, size);
  ctx.strokeStyle = 'rgba(201,168,76,0.7)';
  ctx.lineWidth = size * 0.035;
  ctx.strokeRect(size * 0.08, size * 0.08, size * 0.84, size * 0.84);
  ctx.beginPath();
  ctx.moveTo(size / 2, size * 0.18);
  ctx.lineTo(size * 0.82, size / 2);
  ctx.lineTo(size / 2, size * 0.82);
  ctx.lineTo(size * 0.18, size / 2);
  ctx.closePath();
  ctx.strokeStyle = 'rgba(201,168,76,0.5)';
  ctx.lineWidth = size * 0.018;
  ctx.stroke();
});
const sqBlankFaceTexture = sqMakeTexture((ctx, size) => {
  ctx.fillStyle = '#f5f1e6';
  ctx.fillRect(0, 0, size, size);
});
function sqMakeFaceTexture(rank, suit, color) {
  return sqMakeTexture((ctx, size) => {
    ctx.fillStyle = '#f5f1e6';
    ctx.fillRect(0, 0, size, size);
    const rankSize = size * 0.09, suitSize = size * 0.065;
    const m = size * 0.008, gap = size * 0.012;
    const off = document.createElement('canvas');
    off.width = size; off.height = size;
    const octx = off.getContext('2d');
    octx.fillStyle = color;
    octx.textAlign = 'left';
    octx.textBaseline = 'top';
    octx.font = `700 ${rankSize}px Georgia, serif`;
    const rankW = octx.measureText(rank).width;
    octx.font = `700 ${suitSize}px Georgia, serif`;
    const suitW = octx.measureText(suit).width;
    octx.font = `700 ${rankSize}px Georgia, serif`;
    octx.fillText(rank, 0, 0);
    octx.font = `700 ${suitSize}px Georgia, serif`;
    octx.fillText(suit, rankW + gap, 0);
    const blockW = rankW + gap + suitW;
    const blockH = Math.max(rankSize, suitSize) * 1.15;
    function stampCorner(alignRight, alignBottom) {
      const destX = alignRight ? size - m - blockW : m;
      const destY = alignBottom ? size - m - blockH : m;
      ctx.save();
      if (alignBottom) {
        ctx.translate(destX, destY + blockH);
        ctx.scale(1, -1);
        ctx.drawImage(off, 0, 0);
      } else {
        ctx.drawImage(off, destX, destY);
      }
      ctx.restore();
    }
    stampCorner(false, false);
    stampCorner(true, false);
    stampCorner(false, true);
    stampCorner(true, true);
  });
}

const SQ_W = 1.4, SQ_H = 2.0, SQ_S = 0.62;
function sqBuildFlatCardGeometry(w, h, segs) {
  const geo = new THREE.PlaneGeometry(w, h, segs, segs);
  geo.rotateX(-Math.PI / 2);
  geo.translate(w / 2, 0, h / 2);
  const pos = geo.attributes.position;
  const uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    uv.setXY(i, x / w, z / h);
  }
  uv.needsUpdate = true;
  return geo;
}
function sqBuildCurlableCard(faceTex) {
  const geo = sqBuildFlatCardGeometry(SQ_W, SQ_H, 64);
  const pos = geo.attributes.position;
  const bx = new Float32Array(pos.count);
  const bz = new Float32Array(pos.count);
  for (let i = 0; i < pos.count; i++) { bx[i] = pos.getX(i); bz[i] = pos.getZ(i); }
  const backMat = new THREE.MeshStandardMaterial({ map: sqBackTexture, side: THREE.FrontSide, roughness: 0.8 });
  const faceMat = new THREE.MeshBasicMaterial({ map: faceTex, side: THREE.BackSide });
  const faceMesh = new THREE.Mesh(geo, faceMat);
  const group = new THREE.Group();
  group.add(new THREE.Mesh(geo, backMat), faceMesh);
  return { geo, pos, baseX: bx, baseZ: bz, group, faceMesh };
}
const sqCardA = sqBuildCurlableCard(sqBlankFaceTexture);
const sqCardB = sqBuildCurlableCard(sqBlankFaceTexture);
sqCardA.group.position.set(-0.86 + SQ_NUDGE_X, 0.006, -0.9);
sqCardB.group.position.set(-0.86 + 0.22 + SQ_NUDGE_X, 0.003, -0.9 + 0.06);
sqScene.add(sqCardA.group, sqCardB.group);
const sqCurlCards = [sqCardA, sqCardB];

const SQRT2 = Math.SQRT2;
const sqKAxis = { x: -1 / SQRT2, z: 1 / SQRT2 };
const sqNHat  = { x: -1 / SQRT2, z: -1 / SQRT2 };
const SQ_THETA_MAX = 130 * Math.PI / 180;
const sqDMax = SQ_S / SQRT2;
const cornerCx = 0, cornerCz = 1; // fixed to the corner tested and confirmed on-device

function sqCurlOneCard(card, peel) {
  const thetaTotal = peel * SQ_THETA_MAX;
  const smallAngle = thetaTotal < 0.0005;
  const rho = smallAngle ? 0 : sqDMax / thetaTotal;
  for (let i = 0; i < card.pos.count; i++) {
    const rawX = card.baseX[i], rawZ = card.baseZ[i];
    const x = cornerCx === 0 ? rawX : SQ_W - rawX;
    const z = cornerCz === 0 ? rawZ : SQ_H - rawZ;
    const d = (SQ_S - x - z) / SQRT2;
    if (d <= 0 || smallAngle) {
      card.pos.setXYZ(i, rawX, 0, rawZ);
      continue;
    }
    const phi = d / rho;
    const perp = rho * Math.sin(phi);
    const y = rho * (1 - Math.cos(phi));
    const c = (x - SQ_S) * sqKAxis.x + z * sqKAxis.z;
    const Ax = SQ_S + c * sqKAxis.x;
    const Az = 0 + c * sqKAxis.z;
    let nx = Ax + perp * sqNHat.x;
    let nz = Az + perp * sqNHat.z;
    if (cornerCx !== 0) nx = SQ_W - nx;
    if (cornerCz !== 0) nz = SQ_H - nz;
    card.pos.setXYZ(i, nx, y, nz);
  }
  card.pos.needsUpdate = true;
  card.geo.computeVertexNormals();
}
function sqApplyCurl(peel) {
  sqCurlCards.forEach(card => sqCurlOneCard(card, peel));
}

let sqPeel = 0, sqTargetPeel = 0, sqDragging = false, sqDragStartY = 0, sqDragStartPeel = 0;
sqRenderer.domElement.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  sqDragging = true;
  sqDragStartY = e.clientY; sqDragStartPeel = sqTargetPeel;
  sqRenderer.domElement.setPointerCapture(e.pointerId);
});
sqRenderer.domElement.addEventListener('pointermove', (e) => {
  if (!sqDragging) return;
  e.preventDefault();
  const dy = sqDragStartY - e.clientY;
  sqTargetPeel = Math.min(1, Math.max(0, sqDragStartPeel + dy / 160));
});
function sqRelease() { sqDragging = false; sqTargetPeel = 0; } // let go = cards snap flat, like real cardstock
sqRenderer.domElement.addEventListener('pointerup', sqRelease);
sqRenderer.domElement.addEventListener('pointercancel', sqRelease);
sqRenderer.domElement.addEventListener('pointerleave', sqRelease);

function sqAnimate() {
  sqPeel += (sqTargetPeel - sqPeel) * 0.2;
  sqApplyCurl(sqPeel);
  sqRenderer.render(sqScene, sqCamera);
  requestAnimationFrame(sqAnimate);
}
resizeSqRenderer();
sqAnimate();
window.addEventListener('resize', resizeSqRenderer);
// Single place that "becomes" a given seat: updates mySeat, the on-screen
// badge, and — importantly — re-subscribes the hole-cards listener to the
// correct path. Without this, if a rejoin ever landed on a DIFFERENT seat
// number than before, the old listener would keep watching the wrong path
// forever (Firebase doesn't automatically move a subscription just because
// a JS variable changed).
function adoptSeat(seat) {
  mySeat = seat;
  rememberLocalSeat(myUid, seat);
  document.getElementById('seatBadge').textContent = `You are Seat ${mySeat + 1}`;
  if (unsubscribeHoleCards) unsubscribeHoleCards();
  unsubscribeHoleCards = watchOwnHoleCards(mySeat, (cards) => {
    if (cards) {
      try {
        const suitName = { '\u2660': 'spades', '\u2665': 'hearts', '\u2666': 'diamonds', '\u2663': 'clubs' };
        const suitColor = { '\u2660': '#1a1a1a', '\u2663': '#1a1a1a', '\u2665': '#8c1d2b', '\u2666': '#8c1d2b' };
        sqCardA.faceMesh.material.map = sqMakeFaceTexture(cards[0].rank, cards[0].suit, suitColor[cards[0].suit]);
        sqCardA.faceMesh.material.needsUpdate = true;
        sqCardB.faceMesh.material.map = sqMakeFaceTexture(cards[1].rank, cards[1].suit, suitColor[cards[1].suit]);
        sqCardB.faceMesh.material.needsUpdate = true;
        document.getElementById('handHint').textContent = 'squeeze to peek';
      } catch (e) {
        document.getElementById('error').textContent = '⚠ card render failed: ' + e.message;
        console.error('Hole card render failed:', e);
      }
    } else {
      document.getElementById('handHint').textContent = 'waiting for the deal…';
    }
    sqTargetPeel = 0; // new cards always start flat/closed, never auto-revealed
  });
}

watchConnection((connected) => {
  connEl.textContent = connected ? 'connected' : 'disconnected';
  connEl.className = connected ? 'good' : 'bad';

  // A brief disconnect (screen lock, backgrounded tab, wifi blip — all
  // common on a phone) triggers the onDisconnect cleanup that frees this
  // seat in Firebase. If this tab still remembers a name from earlier in
  // THIS session, silently re-claim the same seat with that same name —
  // nothing was really "lost," just a momentary connection blip while you
  // were doing something else on your phone. Only show the name gate again
  // if this tab genuinely has no memory of ever joining (a real fresh
  // session), which naturally happens once the tab actually closes/reloads,
  // since currentName lives only in this tab's live JS memory.
  if (!connected) {
    wasDisconnected = true;
  } else if (wasDisconnected && myUid) {
    wasDisconnected = false;
    if (currentName) {
      claimSeat(myUid).then((seat) => {
        if (seat === null) return;
        claimName(seat, currentName);
        adoptSeat(seat);
      });
    } else {
      document.getElementById('gameArea').style.display = 'none';
      document.getElementById('nameGate').style.display = 'flex';
      document.getElementById('nameInput').value = '';
    }
  }
});

function renderCard(card) {
  const isRed = card.suit === '♥' || card.suit === '♦';
  return `<span class="card${isRed ? ' red' : ''}">${card.rank}${card.suit}</span>`;
}

// Auth can resolve independently of the name gate — no reason to make
// someone wait to see the name field just because Firebase is still
// signing them in.
(async () => { myUid = await ensureAuth(); await releaseStaleLocalSeat(myUid); })();

document.getElementById('joinBtn').addEventListener('click', async () => {
  const nameInput = document.getElementById('nameInput');
  const name = nameInput.value.trim();
  if (!name) { nameInput.focus(); return; } // no empty names allowed past this point
  currentName = name;
  document.getElementById('nameGate').style.display = 'none';
  document.getElementById('gameArea').style.display = 'flex';
  resizeSqRenderer(); // #squeezeContainer was 0×0 while gameArea was hidden, so the very
                       // first framing at page load was garbage (0/0 aspect) — now that
                       // it has real dimensions, recompute for real.
  document.getElementById('seatBadge').textContent = 'joining…';

  if (!myUid) myUid = await ensureAuth(); // in case the gate was submitted before auth resolved
  const seat = await claimSeat(myUid);
  if (seat === null) {
    document.getElementById('seatBadge').textContent = 'Room is full — could not join.';
    return;
  }
  await claimName(seat, name); // no renaming after this — name is locked in for the session
  adoptSeat(seat);

  // Covers a DIFFERENT case than the reconnect handling above: the host
  // clicking "New Game / Reset" clears seats directly, with no network
  // disconnect involved at all, so the reconnect-based re-claim never
  // fires. Watching seats directly and noticing "my seat's gone" catches
  // this too, so a host reset doesn't leave phones stuck needing a manual
  // reload.
  watchSeats((seats) => {
    if (myUid && seats[mySeat] !== myUid) {
      claimSeat(myUid).then((seat) => {
        if (seat !== null) adoptSeat(seat);
        else document.getElementById('seatBadge').textContent = 'Room is full — could not rejoin.';
      });
    }
  });

  watchPublicState((state) => {
    latestPublicState = state;
    document.getElementById('debug').textContent = 'mySeat=' + mySeat + ' | raw state: ' + JSON.stringify(state);
    try {
      render(state);
      document.getElementById('error').textContent = '';
    } catch (e) {
      document.getElementById('error').textContent = '⚠ render crashed: ' + e.message;
      console.error(e);
    }
  });
});

function render(state) {
  const errorEl = document.getElementById('error');
  if (!state) {
    document.getElementById('info').textContent = 'Waiting for the host to start the game…';
    document.getElementById('squeezeStackReadout').textContent = '';
    document.getElementById('actions').innerHTML = '';
    document.getElementById('board').innerHTML = '';
    document.getElementById('others').innerHTML = '';
    return;
  }
  // BUG FIX: Firebase Realtime Database silently drops any field written as
  // an empty array (or empty object) — it treats [] as "no data" rather
  // than "an empty list". board and foldedSeats both start out empty
  // (before the flop, and before anyone folds), so they were routinely
  // missing from what actually arrives here, crashing every `.map()` /
  // `.includes()` call below. Normalizing once here means every usage
  // after this point can safely assume a real array exists.
  state = { ...state, board: state.board || [], foldedSeats: state.foldedSeats || [], bets: state.bets || {} };

  document.getElementById('board').innerHTML = state.board.map(renderCard).join('') || '<span style="color:#7d8299;font-size:12px;">pre-flop</span>';

  const myStack = state.stacks[mySeat];
  const myBet = state.bets[mySeat] || 0;
  const myToCall = Math.max(0, (state.currentBet || 0) - myBet);
  document.getElementById('squeezeStackReadout').textContent =
    `Your Stack ${myStack}` + (myToCall > 0 ? ` · To call ${myToCall}` : '');
  document.getElementById('info').textContent = state.result
    ? 'Hand complete — waiting for the next hand'
    : '';

  // Other seats, status only (no cards unless it's a real showdown reveal).
  const others = state.activeSeats.filter(s => s !== mySeat).map(seat => {
    const folded = state.foldedSeats.includes(seat);
    const acting = state.actingSeat === seat;
    const cls = folded ? 'folded' : (acting ? 'acting' : '');
    const revealedCards = state.revealedHoleCards && state.revealedHoleCards[seat]
      ? ' ' + state.revealedHoleCards[seat].map(renderCard).join('') : '';
    return `<div class="${cls}">Seat ${seat + 1}: ${state.stacks[seat]} chips${revealedCards}</div>`;
  }).join('');
  document.getElementById('others').innerHTML = others;

  // Action buttons — only when it's genuinely my turn, computed the same
  // way the host will validate it (getLegalActions is a pure function, so
  // running it here just predicts what the host will accept).
  const actionsEl = document.getElementById('actions');
  const myRevealTurn = state.pendingReveal && state.pendingReveal.order[state.pendingReveal.currentIndex] === mySeat;
  const myVoluntaryTurn = state.pendingVoluntaryShow && state.pendingVoluntaryShow.seat === mySeat && !state.pendingVoluntaryShow.decided;

  if (myRevealTurn || myVoluntaryTurn) {
    // The TV is the real authority on the 5-second auto-muck timer — this
    // countdown is purely informational, so a slow phone can't break
    // enforcement, only its own on-screen number might drift slightly.
    const label = myRevealTurn ? 'Show or muck your hand?' : 'Show your hand?';
    actionsEl.innerHTML = `
      <div style="width:100%;text-align:center;color:#c9a84c;margin-bottom:8px;">${label}
        <span id="revealCountdown" style="color:#7d8299;font-weight:normal;"></span></div>
      <div style="display:flex;justify-content:center;gap:12px;width:100%;">
        <button data-decision="show">Show</button>
        <button data-decision="muck" class="fold">Muck</button>
      </div>`;
    let secondsLeft = 6;
    const countdownEl = document.getElementById('revealCountdown');
    countdownEl.textContent = `(${secondsLeft}s)`;
    const countdownHandle = setInterval(() => {
      secondsLeft--;
      if (countdownEl.isConnected && secondsLeft > 0) countdownEl.textContent = `(${secondsLeft}s)`;
      else clearInterval(countdownHandle);
    }, 1000);
    actionsEl.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const showing = btn.dataset.decision === 'show';
        const type = myRevealTurn ? (showing ? 'show' : 'muck') : (showing ? 'voluntaryShow' : 'voluntaryMuck');
        requestAction(mySeat, { type });
        clearInterval(countdownHandle);
        actionsEl.innerHTML = '';
      });
    });
  } else if (!state.result && state.actingSeat === mySeat) {
    const fakeBettingRoundState = {
      actingSeat: state.actingSeat, activeSeats: state.activeSeats, folded: state.foldedSeats,
      allIn: state.activeSeats.filter(s => state.stacks[s] === 0 && !state.foldedSeats.includes(s)),
      bets: state.bets, stacks: state.stacks, currentBet: state.currentBet, minRaiseAmount: state.minRaiseAmount,
    };
    const { legal, toCall, minRaiseTotal, maxRaiseTotal } = getLegalActions(fakeBettingRoundState, mySeat);

    let topRowHtml = '';
    let customPanelHtml = '';
    let customToggleHtml = '';
    let hasRaise = false;
    legal.forEach((type) => {
      if (type === 'raise') {
        hasRaise = true;
        // Real pot size right now = everything already committed in earlier
        // completed streets (state.totalBets) + this round's bets so far —
        // there's no single "pot" field, it has to be derived from both.
        const pot = Object.values(state.totalBets || {}).reduce((a, b) => a + b, 0)
                  + Object.values(state.bets || {}).reduce((a, b) => a + b, 0);
        const potAfterCall = pot + toCall;
        const clamp = (n) => Math.max(minRaiseTotal, Math.min(maxRaiseTotal, Math.round(n)));
        const presets = [
          { label: 'Min Raise', amount: minRaiseTotal },
          ...(state.currentBet > 0 ? [{ label: '3x Bet', amount: clamp(state.currentBet * 3) }] : []),
          { label: '\u00bd Pot', amount: clamp(state.currentBet + potAfterCall * 0.5) },
          { label: 'Pot', amount: clamp(state.currentBet + potAfterCall) },
        ].filter(p => p.amount < maxRaiseTotal); // don't duplicate the All-in button below
        topRowHtml += presets.map(p =>
          `<button data-type="raise" data-amount="${p.amount}">${p.label} (${p.amount})</button>`).join('');
        topRowHtml += `<button data-type="raise" data-amount="${maxRaiseTotal}">All-in (${maxRaiseTotal})</button>`;
        if (minRaiseTotal < maxRaiseTotal) { // a slider needs an actual range to be worth showing
          customToggleHtml = `<button id="customToggleBtn" type="button">Custom</button>`;
          customPanelHtml = `
            <input type="range" id="customSlider" min="${minRaiseTotal}" max="${maxRaiseTotal}" value="${minRaiseTotal}" style="width:100%;">
            <div id="customAmount" style="text-align:left;color:#c9a84c;font-weight:600;margin:4px 0;">Raise to ${minRaiseTotal}</div>
            <div style="display:flex;justify-content:center;gap:10px;">
              <button data-type="raise" data-amount="${minRaiseTotal}" id="customConfirmBtn">Confirm</button>
              <button type="button" id="customCancelBtn">Cancel</button>
            </div>`;
        }
      } else if (type !== 'fold') {
        const label = type === 'call' ? `Call ${toCall}` : type[0].toUpperCase() + type.slice(1);
        topRowHtml += `<button data-type="${type}">${label}</button>`;
      }
    });
    const foldRowHtml = (legal.includes('fold') ? `<button data-type="fold" class="fold">Fold</button>` : '')
      + customToggleHtml;

    actionsEl.innerHTML = `
      <div id="actionsTop">${topRowHtml}</div>
      <div id="customPanel" style="display:none;width:100%;">${customPanelHtml}</div>
      <div id="actionsFoldRow">${foldRowHtml}</div>`;

    if (hasRaise && document.getElementById('customToggleBtn')) {
      const topEl = document.getElementById('actionsTop');
      const panelEl = document.getElementById('customPanel');
      document.getElementById('customToggleBtn').addEventListener('click', () => {
        topEl.style.display = 'none';
        panelEl.style.display = 'block';
      });
      document.getElementById('customCancelBtn').addEventListener('click', () => {
        panelEl.style.display = 'none';
        topEl.style.display = 'flex';
      });
      const slider = document.getElementById('customSlider');
      const amountLabel = document.getElementById('customAmount');
      const confirmBtn = document.getElementById('customConfirmBtn');
      slider.addEventListener('input', () => {
        amountLabel.textContent = `Raise to ${slider.value}`;
        confirmBtn.dataset.amount = slider.value;
      });
    }

    actionsEl.querySelectorAll('button[data-type]').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.dataset.type;
        const action = type === 'raise' ? { type, amount: Number(btn.dataset.amount) } : { type };
        if (type === 'fold') SFX.fold();
        else if (type === 'check' || type === 'call') SFX.checkCall();
        else if (type === 'raise') SFX.raise();
        requestAction(mySeat, action);
        errorEl.textContent = '';
        actionsEl.innerHTML = ''; // avoid double-taps while waiting for the host to process
      });
    });
  } else {
    actionsEl.innerHTML = '';
  }

  document.getElementById('resultBox').textContent = state.result
    ? (state.result.uncontested
        ? (() => {
            const winnerEntry = Object.entries(state.result.payouts).find(([, a]) => a > 0);
            return winnerEntry ? `Seat ${Number(winnerEntry[0]) + 1} wins uncontested.` : 'Hand complete.';
          })()
        : 'Showdown — see the TV for full results.')
    : '';
}
</script>
</body>
</html>
